schema_version = "1.0"

# clippy-exceptions.toml is the receipt ledger for every
# `#[expect(clippy::..., reason = "policy:clippy-XXXX")]` suppression
# in the codebase. PR 06 ("Clippy exception checker") enforces:
#
#   - no bare `#[allow(clippy::...)]`
#   - every `#[expect(clippy::...)]` carries a `reason = "policy:..."`
#     pointing at an entry below
#   - every entry has an owner, classification, reason, and expiry
#   - expired entries fail the policy gate
#
# Entries are added on demand as crates earn an exception. The file is
# intentionally empty during the staging phase so that no exception
# can land without a real receipt.

# [[exception]]
# id = "clippy-0001"
# lint = "clippy::indexing_slicing"
# path = "crates/bitnet-kernels/src/generated_table.rs"
# classification = "generated_table"
# owner = "kernels"
# reason = "Generated lookup table has validated generation invariants; migrate to safe table wrapper."
# expires = "2026-07-01"
#
# [exception.selector]
# kind = "expr"
# container = "lookup_state"
# text_contains = "TABLE[idx]"
#
# [exception.last_seen]
# line = 42
# column = 9

# Two approved provider accesses for the private generation lifecycle field.
# Unfulfilled expectations fail in the owner module and in dedicated CI probes.
[[exception]]
id = "clippy-0001"
lint = "clippy::disallowed_fields"
path = "crates/bitnet-inference/src/generation_state.rs"
classification = "encapsulation_owner"
owner = "inference"
reason = "GenerationTracker::state is the sole owner read of the private lifecycle field; all other field expressions and destructuring remain denied."
created = "2026-10-21"
review_after = "2026-11-01"
expires = "2026-11-07"

[exception.selector]
kind = "fn"
container = "GenerationTracker::state"
text_contains = "self.state"

[[exception]]
id = "clippy-0002"
lint = "clippy::disallowed_fields"
path = "crates/bitnet-inference/src/generation_state.rs"
classification = "encapsulation_owner"
owner = "inference"
reason = "GenerationTracker::set_state is the sole owner write of the private lifecycle field; existing lifecycle methods keep their original transition behavior."
created = "2026-10-21"
review_after = "2026-11-01"
expires = "2026-11-07"

[exception.selector]
kind = "fn"
container = "GenerationTracker::set_state"
text_contains = "self.state = state"
