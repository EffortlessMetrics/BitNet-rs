# Non-Rust file allowlist for BitNet-rs.
#
# Schema: 1.0
# Owner:  policy/non-rust-files
#
# Each entry is a structured receipt: identity (path or glob), kind, owner,
# surface, classification, reason, and (where appropriate) covered_by and
# expires. Production / test / tooling surfaces require covered_by — the
# canonical command(s) that exercise the file in CI.
#
# The allowlist is checked by `cargo xtask check-file-policy`. In the
# current rollout stage the check is advisory (Schema errors and expired
# entries fail; uncovered files and unused entries are reported but do not
# block CI until PR 9). See docs/development/BITNET_POLICY_ROLLOUT.md.

schema_version = "1.0"

# -----------------------------------------------------------------------------
# CI declarative
# -----------------------------------------------------------------------------

[[allow]]
glob = ".github/workflows/*.yml"
kind = "ci_declarative"
owner = "release/ci"
surface = "ci"
classification = "config"
reason = "GitHub Actions workflow definitions are platform-required YAML."

# -----------------------------------------------------------------------------
