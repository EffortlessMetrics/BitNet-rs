# -----------------------------------------------------------------------------

[[allow]]
path = "Dockerfile"
kind = "build_config"
owner = "release/containers"
surface = "ci"
classification = "config"
reason = "Primary release container for bitnet-rs CLI."

[[allow]]
glob = "ci/Dockerfile.*"
kind = "build_config"
owner = "release/containers"
surface = "ci"
classification = "config"
reason = "CI container variants (bitnet-cpp cache, etc.)."

[[allow]]
glob = "docker/Dockerfile.*"
kind = "build_config"
owner = "release/containers"
