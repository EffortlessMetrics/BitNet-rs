coverage:
  precision: 2
  round: down
  range: "50...80"

  status:
    project:
      default:
        target: auto
        threshold: 2%
        informational: true
        flags:
          - rust-cpu

    patch:
      default:
        target: 70%
        threshold: 5%
        informational: true
        flags:
          - rust-cpu

comment: false

github_checks:
  annotations: false
