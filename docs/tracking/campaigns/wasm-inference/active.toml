id = "wasm-inference"
title = "WASM inference proof lane"
status = "active"

objective = "Establish WASM as an explicit receipt-backed BitNet backend lane for browser, Node, WASI, and embedded-sandbox hosts without conflating WASM detection, placeholder generation, model parsing, or scalar fallback with real inference."

end_state = [
  "WASM backend identities are explicit: wasm-cpu-scalar, wasm-cpu-simd, wasm-cpu-threads, wasm-browser-worker, and wasm-wasi-sandbox.",
  "Byte-backed model and tokenizer loaders avoid browser filesystem assumptions.",
  "Tiny-fixture inference proves at least one deterministic generated token with fallback_used=false before any official BitNet browser claim.",
  "Browser product claims run in a worker, use separately supplied model artifacts, record strict hashes, and emit memory high-water receipts.",
  "SIMD, threads, official BitNet, and speed claims are gated by strict receipts that prove exactly what ran.",
]

hard_constraints = [
  "WASM detection is not inference.",
  "Placeholder generation cannot count as inference, parity, or performance proof.",
  "A model loader probe cannot count as sandboxed inference.",
  "Generic cpu or generic wasm backend labels cannot support WASM proof.",
  "Strict mode must fail rather than silently downgrade SIMD or threads.",
  "Model weights must not be embedded in the WASM runtime bundle for product claims.",
  "Do not claim browser BitNet 2B feasibility, usability, or speed until smaller fixture and short-decode proofs exist.",
]

[[work_item]]
id = "WASM-001"
status = "ready"
branch = "codex/wasm-inference/WASM-001-proof-contract"
stackable = false
review_mode = "codex_premerge"
merge_policy = "automerge_when_green"
human_gate = "on_blocker_only"
blocked_by = []
acceptance = "Document the WASM proof contract, current scaffold boundary, explicit backend identities, receipt requirements, model/tokenizer strategy, memory plan, milestones, and PR ladder without changing runtime code."
commands = [
  "cargo run --locked -p xtask --no-default-features -- campaign check wasm-inference",
  "cargo run --locked -p xtask --no-default-features -- campaign generate --check",
  "cargo run --locked -p xtask --no-default-features -- campaign doctor",
  "git diff --check",
]
allowed_paths = [
  "docs/wasm/**",
  "docs/tracking/campaigns/wasm-inference/**",
]
forbidden_paths = [
  "crates/bitnet-wasm/**",
  "crates/bitnet-inference/**",
  "crates/bitnet-kernels/**",
  "crates/bitnet-tokenizers/**",
  "crates/bitnet-models/**",
]
may_claim = [
  "A WASM inference proof lane and planning contract exist.",
  "Current WASM inference remains scaffolded until later work items prove real generation.",
]
must_not_claim = [
  "WASM inference works today.",
  "Browser BitNet 2B inference is feasible at usable speed.",
  "WASM SIMD kernels are proven.",
  "A byte-backed GGUF/tokenizer loader exists.",
]

