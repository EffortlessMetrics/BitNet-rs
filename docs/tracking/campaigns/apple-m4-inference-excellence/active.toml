id = "apple-m4-inference-excellence"
title = "Apple M4 inference excellence"
status = "active"

objective = "Move the M4 Mac mini from complete evidence lanes to excellent, repeatable local inference across supported dense SLMs and BitNet: deeper deterministic accuracy, fuller benchmark envelopes, enough matching-history receipts to remove important insufficient-history gaps, BitNet-specific product proof, reproducible run and artifact identity, service-surface conformance, clearer operator UX, and phase-scoped acceleration discipline without broad Apple Silicon or unsupported backend claims."

end_state = [
  "Every supported dense M4 SLM model has repeated matching-history eval and benchmark receipts under the same model/tokenizer/backend/fallback identity.",
  "The accepted BitNet artifact has repeated matching-history eval, benchmark, and variable warm-session receipts before any chat or serve claim changes.",
  "Dense SLM and BitNet eval corpora are large enough to report useful mechanical pass rates by task family without required LLM judging.",
  "Benchmark reports include cold load, tokenizer load, prompt tokenization, prefill/input throughput, TTFT, output/decode throughput, sampling overhead, total wall time, peak memory, and memory drift with p50/p90/p99 and min/max where supported.",
  "Every committed M4 receipt records reproducible run identity: machine, OS, git commit, binary/build profile, model artifact, tokenizer authority, prompt template, backend, fallback state, corpus/profile seed, and exact command class.",
  "Supported model artifacts have provenance manifests and cache verification receipts that separate file identity, tokenizer authority, prompt template identity, license/source metadata, and local cache state.",
  "Corpus, scorer, normalization, and golden-token canary versions are recorded before pass rates or drift are interpreted.",
  "Benchmark summaries record environment preflight and repeatability variance before p50/p90/p99 drift thresholds are treated as meaningful.",
  "Operator docs translate receipts into local operating classes such as interactive, advisory, batch, and unsupported.",
  "Dense SLM and BitNet service surfaces have explicit health, ready, streaming, timeout, cancellation, and per-request receipt conformance before any user-facing service claim expands.",
  "Release gates state exactly which eval, benchmark, stability, service, and operator checks must pass before updating the public M4 expectation envelope.",
  "Operator UX exposes supported models, cache/disk health, last dense and BitNet reports, current regressions, unsupported claim boundaries, and recommended next commands.",
  "Metal work remains phase-scoped with CPU parity, fallback-free phase receipts, and explicit CPU/NEON remainder until a full route is separately proven.",
]

hard_constraints = [
  "This is an M4 Mac mini inference-excellence campaign.",
  "Do not reopen completed Apple M4 dense SLM, BitNet local-answer, BitNet eval/benchmark, BitNet productization, inference-ops, local server, durable evidence, or Metal campaigns unless a regression proves they are wrong.",
  "Do not use dense Qwen evidence as BitNet evidence.",
  "Do not use MacBook artifact-only evidence as M4 runtime proof.",
  "Do not enable BitNet chat or BitNet serve until the campaign item for that surface has matching receipts and gates.",
  "Do not claim full apple-m4-metal inference, QK256 support, Neural Engine execution, MPSGraph model inference, MacBook evidence, broad Apple Silicon performance, broad model quality, or speedup.",
  "Do not add live model downloads, hardware timing runs, BitNet runtime runs, or long resident soaks to generic required PR CI.",
  "Never commit model binaries.",
  "Do not let eval, benchmark, serve, or status commands contact external services except for explicit model fetch commands.",
]

