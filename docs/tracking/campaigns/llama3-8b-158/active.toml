id = "LLAMA3-158-000"
status = "ready"
branch = "codex/llama3-158-source-map-specs"
stackable = false
review_mode = "codex_premerge"
merge_policy = "automerge_when_green"
human_gate = "on_blocker_only"
blocked_by = []
acceptance = "Add Llama3 8B 1.58 proposal, source map, implementation plan, active campaign, conservative model/kernel/Apple matrices, and spec contracts without runtime changes, model binaries, or support promotion beyond registered."
commands = [
  "cargo run --locked -p xtask --no-default-features -- campaign check llama3-8b-158",
  "cargo run --locked -p xtask --no-default-features -- campaign generate --check",
  "git diff --check",
]
