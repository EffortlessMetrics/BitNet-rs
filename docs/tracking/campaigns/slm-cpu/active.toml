id = "slm-cpu"
title = "Small dense model CPU proof"
status = "active"

objective = "Make the Intel i5-8250U a strict CPU proof host for small dense transformer GGUF models by proving metadata, tokenizer, architecture adapter, CPU execution, and tiny answer evidence without claiming throughput."

end_state = [
  "A dense GGUF candidate is selected by verified architecture and tokenizer metadata.",
  "Tokenizer source and strictness are recorded.",
  "Dense architecture metadata maps into a typed adapter contract.",
  "Tiny CPU answer receipts record prompt IDs, generated IDs, decoded text, selected backend/kernel, and fallback=false.",
  "8250U evidence is correctness and operability evidence, not performance evidence.",
]

hard_constraints = [
  "Do not edit BitNet QK256/I2_S kernels.",
  "Do not change BitNet proof receipt semantics.",
  "Do not claim sustained 8250U throughput.",
  "Do not claim server, GPU, OpenVINO, UHD 620, or NPU execution.",
  "Do not use model name recognition as proof of GGUF compatibility.",
]

[[work_item]]
id = "SLM-CPU-000"
status = "merged"
pr = 3902
branch = "codex/slm-cpu-000-8250u-lane"
stackable = false
review_mode = "codex_premerge"
merge_policy = "automerge_when_green"
human_gate = "on_blocker_only"
blocked_by = []
acceptance = "Define a separate 8250U dense SLM CPU proof lane with explicit target policy, dense GGUF requirements, tokenizer authority rules, architecture adapter boundaries, receipt fields, and claim boundaries. The first candidate policy prefers Qwen2.5-0.5B-Instruct GGUF Q4_K_M or Q8_0 after verifying exact artifact metadata."
commands = [
  "cargo run -p xtask --no-default-features -- campaign generate",
  "cargo run -p xtask --no-default-features -- campaign doctor",
  "git diff --check",
]
allowed_paths = [
  "docs/tracking/campaigns/slm-cpu/**",
  "docs/tracking/generated/**",
]
forbidden_paths = [
  "crates/bitnet-quantization/**",
  "crates/bitnet-kernels/src/gpu/**",
  "crates/bitnet-server/**",
  "crates/bitnet-npu/**",
]
may_claim = [
  "The 8250U dense SLM CPU lane contract exists after merge.",
  "Qwen2.5-0.5B-Instruct is the preferred first candidate class, pending exact GGUF metadata verification.",
]
must_not_claim = [
  "A dense GGUF artifact is verified.",
  "Dense CPU inference works.",
  "Answer quality is proven.",
  "Sustained 8250U throughput is proven.",
  "Server, GPU, OpenVINO, UHD 620, or NPU execution is involved.",
]

