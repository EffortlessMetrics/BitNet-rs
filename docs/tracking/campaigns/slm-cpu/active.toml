id = "slm-cpu"
title = "Small dense model CPU proof"
status = "active"

objective = "Make the Intel i5-8250U a strict CPU proof host for small dense transformer GGUF models by proving metadata, tokenizer, architecture adapter, CPU execution, and tiny answer evidence without claiming throughput."

end_state = [
  "A dense GGUF candidate is selected by verified architecture and tokenizer metadata.",
  "Tokenizer source and strictness are recorded.",
  "Dense architecture metadata maps into a typed adapter contract.",
  "Tiny CPU answer receipts record prompt IDs, generated IDs, decoded text, selected backend/kernel, and fallback=false.",
  "8250U evidence is correctness and operability evidence, not performance evidence.",
]

hard_constraints = [
  "Do not edit BitNet QK256/I2_S kernels.",
  "Do not change BitNet proof receipt semantics.",
  "Do not claim sustained 8250U throughput.",
  "Do not claim server, GPU, OpenVINO, UHD 620, or NPU execution.",
  "Do not use model name recognition as proof of GGUF compatibility.",
]

