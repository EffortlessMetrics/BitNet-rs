  "cargo run --locked -p xtask --no-default-features -- campaign generate --check",
  "git diff --check",
]
allowed_paths = [
  ".github/workflows/**",
  "docs/tracking/TRACKER_MODEL.md",
  "docs/tracking/campaigns/**",
  "docs/tracking/generated/**",
  "xtask/src/**",
]
forbidden_paths = [
  "crates/**",
  "tests/**",
]
may_claim = [
  "Campaign tracker checks are enforced in CI after merge.",
]
must_not_claim = [
  "Runtime behavior changed.",
  "Legacy global tracking has been removed.",
]

[[work_item]]
id = "TRACKER-003"
status = "in_progress"
branch = "codex/tracker-infra/TRACKER-003-current-pr-reconciliation"
stackable = false
requires_human_merge = true
blocked_by = ["TRACKER-002"]
acceptance = "Scope GitHub PR reconciliation to the current pull request in PR CI so parallel campaign branches do not need to carry each other's item TOML changes."
commands = [
  "cargo fmt --all -- --check",
  "cargo test --locked -p xtask --no-default-features campaign::tests",
  "cargo run --locked -p xtask --no-default-features -- campaign doctor",
  "cargo run --locked -p xtask --no-default-features -- campaign generate --check",
  "git diff --check",
]
allowed_paths = [
  "docs/tracking/TRACKER_MODEL.md",
  "docs/tracking/campaigns/tracker-infra/**",
  "docs/tracking/generated/**",
  "xtask/src/**",
]
forbidden_paths = [
  "crates/**",
  "tests/**",
]
may_claim = [
  "GitHub PR reconciliation remains strict for the current PR while avoiding cross-branch live-lock deadlocks.",
]
must_not_claim = [
  "Runtime behavior changed.",
  "Legacy global tracking has been removed.",
]
