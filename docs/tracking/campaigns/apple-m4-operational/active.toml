id = "apple-m4-operational"
title = "Apple M4 operational readiness"
status = "active"

objective = "Turn the completed Apple M4 proof lane into a repeatable operator workflow with one-command validation, durable receipts, clear docs, stable failure modes, and benchmark profiles."

end_state = [
  "A single Apple M4 validation command emits the expected machine, probe, smoke, parity, graph, strict BitNet CPU/NEON, profile, allocation, and summary receipts.",
  "A receipt-bundle checker rejects missing fallback status, unsupported Apple claims, missing BitNet fields, and accidental QK256 or Neural Engine claims.",
  "The operator runbook documents model placement, commands, receipt paths, backend labels, failure modes, and unsupported claims.",
  "CLI examples make effective Apple CPU/NEON use and Metal phase proof repeatable without relying on hidden test knowledge.",
  "Benchmark profiles are conservative, named, and tied to receipt-backed proof boundaries.",
  "The next Apple implementation frontier is selected explicitly instead of reopening the completed proof campaign.",
]

hard_constraints = [
  "Do not reopen the completed apple-m4 proof campaign.",
  "Do not claim full apple-m4-metal model inference unless a strict real-model receipt proves it.",
  "Do not claim Neural Engine execution from MPSGraph.",
  "Do not claim QK256 on Apple Silicon.",
  "Do not claim general M4 performance from tiny-kernel benchmarks.",
]

[[work_item]]
id = "M4-OP-001"
status = "merged"
branch = "codex/apple-m4-operational/M4-OP-001-validation-bundle"
stackable = false
review_mode = "codex_premerge"
merge_policy = "automerge_when_green"
human_gate = "on_blocker_only"
blocked_by = []
acceptance = "Add a one-command Apple M4 validation bundle that runs the known-good proof sequence, writes the expected receipts under a caller-provided output directory, validates every receipt, and writes a summary that states exactly what is and is not proven."
commands = [
  "cargo fmt --all -- --check",
  "cargo test --locked -p xtask --no-default-features apple_m4",
  "cargo run --locked -p xtask --no-default-features -- apple-m4 validate --help",
  "cargo run --locked -p xtask --no-default-features -- apple-m4 receipts-check --help",
  "cargo run --locked -p xtask --no-default-features -- campaign check apple-m4-operational",
  "cargo run --locked -p xtask --no-default-features -- campaign doctor",
  "cargo run --locked -p xtask --no-default-features -- campaign generate --check",
  "git diff --check",
]
allowed_paths = [
  "xtask/src/**",
  "docs/hardware/apple-m4-mac-mini-operator-runbook.md",
  "docs/tracking/campaigns/apple-m4-operational/**",
  "docs/tracking/generated/**",
]
forbidden_paths = [
  "crates/bitnet-quantization/src/qk256/**",
  "crates/bitnet-qk256-dispatch/**",
  "crates/bitnet-server/**",
]
may_claim = [
  "Apple M4 validation receipts can be generated and checked through an operator command after merge.",
]
must_not_claim = [
  "Full apple-m4-metal model inference works.",
  "QK256 works on Apple Silicon.",
  "Neural Engine execution is proven.",
  "General M4 performance is proven.",
]

