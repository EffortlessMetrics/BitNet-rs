id = "apple-m4-dense-slm-regression"
title = "Apple M4 dense SLM regression guardrails"
status = "active"

objective = "Turn the measured Apple M4 dense SLM local-answer envelope into repeatable regression guardrails for quality, determinism, receipt schema, model-cache identity, warm-session timing, and memory drift without broadening the claim beyond the recorded Qwen2.5 dense SLM Apple CPU/NEON path."

end_state = [
  "Regression checks compare release-mode Apple M4 dense SLM receipts against the published envelope only when the model, tokenizer, profile, backend, machine context, and fallback status match.",
  "Quality and determinism drift are treated as correctness failures before timing drift is interpreted.",
  "Warm_16, warm_32, warm_64, and warm_128 profiles track time-to-first-token, warm prompt throughput, decode throughput, total session time, and peak memory.",
  "Receipt schema, model hash, tokenizer metadata, cache verification, backend routing, and fallback status are validated before performance fields are compared.",
  "Metal phase receipts remain phase-scoped and cannot promote full apple-m4-metal inference without a later strict full-inference campaign.",
  "Dense Qwen SLM evidence remains separate from BitNet, 1-bit / 1.58-bit model quality, QK256, and Apple BitNet claims.",
]

hard_constraints = [
  "Do not reopen the completed apple-m4, apple-m4-slm-answer, apple-m4-productization, or apple-m4-slm-performance campaigns.",
  "Do not weaken the blocked BitNet apple-m4-local-answer gates.",
  "Do not claim BitNet local-answer quality from dense SLM evidence.",
  "Do not claim full apple-m4-metal inference from a named Metal phase.",
  "Do not claim Neural Engine execution, MPSGraph model inference, QK256 support, or broad M4 performance.",
  "Do not turn a single M4 Mac mini envelope into a fleet-wide Apple Silicon performance guarantee.",
  "Do not make performance drift a hard CI failure until a scheduled Apple hardware lane produces repeatable receipts.",
  "Never commit model binaries.",
]

