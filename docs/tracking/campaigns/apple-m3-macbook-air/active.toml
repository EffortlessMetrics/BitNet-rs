  "models/**",
]
may_claim = [
  "The M3 MacBook Air lane has a campaign-local roadmap and tracker.",
]
must_not_claim = [
  "Any model was run.",
  "Any BitNet artifact was accepted.",
  "M3 Air evidence proves M4 Mac mini performance.",
]

