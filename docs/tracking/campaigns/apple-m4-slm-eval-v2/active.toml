  "target/release/bitnet mac receipts-check ci/hardware/apple-m4-mac-mini/<date>/slm-eval-v2/<model-id>/summary.json --json",
  "cargo test --locked -p bitnet-cli --no-default-features --features cpu,full-cli --test cli_arg_tests answer_corpus",
  "cargo test --locked -p bitnet-cli --no-default-features --features cpu,full-cli --test cli_arg_tests slm_eval_v2",
  "cargo run --locked -p xtask --no-default-features -- campaign check apple-m4-slm-eval-v2",
  "cargo run --locked -p xtask --no-default-features -- campaign doctor",
  "cargo run --locked -p xtask --no-default-features -- campaign generate --check",
  "git diff --check",
]
allowed_paths = [
  "crates/bitnet-cli/src/commands/answer_corpus.rs",
