id = "apple-m4-continuity"
title = "Apple M4 continuity"
status = "active"

objective = "Keep the M4 Mac mini useful as the local Apple Silicon dense-SLM appliance while BitNet artifact qualification happens elsewhere, by improving resident Mac UX, smoke validation, latency polish, and blocked BitNet proof preparation without widening hardware claims."

end_state = [
  "The supported dense Qwen2.5 Apple M4 CPU/NEON path has a resident Mac chat/session wrapper for multiple prompts with model/tokenizer reuse.",
  "A compact Mac smoke command can verify cache health, a tiny answer surface, receipt validity, and backend/fallback identity.",
  "Latency polish focuses on time-to-first-token, streaming behavior, and avoiding user-visible overhead without claiming broad M4 performance.",
  "Longer resident dense-SLM runs record memory and timing stability without broadening the model or backend claim.",
  "The M4 BitNet proof command and receipt schema are prepared but remain blocked until an accepted BitNet artifact is available.",
]

hard_constraints = [
  "This is an M4 Mac mini local campaign; do not execute MacBook artifact sweeps or MacBook receipts here.",
  "Do not reopen completed Apple M4 proof, operational, SLM answer, productization, performance, hardening, or dense regression campaigns.",
  "Do not weaken blocked BitNet local-answer gates.",
  "Do not claim BitNet local-answer quality from dense Qwen SLM evidence.",
  "Do not claim full apple-m4-metal inference, Neural Engine execution, MPSGraph model inference, QK256 support, or broad M4 performance.",
  "Do not touch QK256, bitnet-qk256-dispatch, server inference, or Metal kernels.",
  "Never commit model binaries.",
]

[[work_item]]
id = "M4-CONT-001"
status = "merged"
pr = 4253
merge_sha = "d1cddbf97da62663b48658d0e68b8d19a80d4fb3"
branch = "codex/apple-m4-continuity/M4-CONT-001-mac-chat"
stackable = false
review_mode = "codex_premerge"
merge_policy = "automerge_when_green"
human_gate = "on_blocker_only"
blocked_by = []
acceptance = "Add a resident `bitnet mac chat` wrapper for the supported dense Qwen Apple M4 CPU/NEON path, accepting repeated prompts or stdin, streaming by default, reusing the existing warm-session runner so the model/tokenizer load once, writing aggregate and per-prompt receipts, and preserving device-boundary errors before cache/model work."
commands = [
  "cargo fmt --all -- --check",
  "cargo test --locked -p bitnet-cli --no-default-features --features cpu,full-cli --test cli_arg_tests mac_chat -- --nocapture",
  "cargo test --locked -p bitnet-cli --no-default-features --features cpu,full-cli --test cli_arg_tests mac_ask -- --nocapture",
  "cargo run --locked -p xtask --no-default-features -- campaign check apple-m4-continuity",
  "cargo run --locked -p xtask --no-default-features -- campaign doctor",
  "cargo run --locked -p xtask --no-default-features -- campaign generate --check",
  "git diff --check",
]
allowed_paths = [
  ".codex/campaigns/apple-m4-continuity/**",
  "crates/bitnet-cli/src/mac.rs",
  "crates/bitnet-cli/tests/**",
  "docs/slm/**",
  "docs/tracking/campaigns/apple-m4-continuity/**",
  "docs/tracking/generated/**",
]
forbidden_paths = [
  "crates/bitnet-quantization/src/qk256/**",
  "crates/bitnet-qk256-dispatch/**",
  "crates/bitnet-server/**",
  "crates/bitnet-kernels/src/metal/**",
  "models/**",
]
may_claim = [
  "The Mac dense-SLM path has a resident multi-prompt wrapper that reuses the supported Apple M4 CPU/NEON warm-session runner.",
  "`bitnet mac chat` preserves the verified Qwen2.5 cache flow, aggregate/per-prompt receipts, and apple-m4-cpu-neon boundary.",
]
must_not_claim = [
  "BitNet local-answer quality is proven.",
  "Full apple-m4-metal inference works.",
  "MPSGraph or Neural Engine model inference works.",
  "QK256 works on Apple Silicon.",
  "Broad M4 performance is proven.",
]

