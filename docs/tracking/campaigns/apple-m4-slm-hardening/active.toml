id = "apple-m4-slm-hardening"
title = "Apple M4 SLM hardening"
status = "active"

objective = "Make the completed Apple M4 SLM path boring for local users through simple Mac commands, default verified model-cache behavior, clear first-run guidance, stable receipts, and conservative hardware claim boundaries."

end_state = [
  "bitnet mac ask \"question\" works as the shortest supported Mac local-answer command.",
  "Existing bitnet mac ask --question \"question\" scripts continue to work.",
  "First-run and missing-cache failures point directly to bitnet model fetch qwen2.5-0.5b-instruct-q8_0.",
  "Device-boundary failures still reject full apple-m4-metal, MPSGraph inference, and hidden fallback before cache or model work.",
  "Receipts and docs preserve model, tokenizer, backend, fallback, generated text, token IDs, and timing expectations.",
]

hard_constraints = [
  "Do not reopen completed Apple M4 proof, operational, SLM answer, productization, or performance campaigns.",
  "Do not weaken blocked BitNet local-answer gates.",
  "Do not claim BitNet local-answer quality from dense SLM evidence.",
  "Do not claim full apple-m4-metal inference, Neural Engine execution, MPSGraph model inference, QK256 support, or broad M4 performance.",
  "Do not touch QK256, bitnet-qk256-dispatch, server inference, or Metal kernels.",
  "Never commit model binaries.",
]

[[work_item]]
id = "M4-SLM-HARDEN-001"
status = "merged"
pr = 4149
merge_sha = "d31dd7651c382eeb1e4d1c46b7bf02f1ba60ba3c"
branch = "codex/apple-m4-slm-hardening/M4-SLM-HARDEN-001-positional-mac-ask"
stackable = false
review_mode = "codex_premerge"
merge_policy = "automerge_when_green"
human_gate = "on_blocker_only"
blocked_by = []
acceptance = "Allow bitnet mac ask \"What is 2+2?\" as the shortest supported Mac local-answer command, keep bitnet mac ask --question compatible, reject ambiguous double question input, preserve default verified Qwen2.5 cache resolution, and keep device-boundary errors before cache/model work."
commands = [
  "cargo fmt --all -- --check",
  "cargo test --locked -p bitnet-cli --no-default-features --features cpu,full-cli --test cli_arg_tests mac_ask -- --nocapture",
  "cargo test --locked -p bitnet-cli --no-default-features --features cpu,full-cli --test cli_snapshot_tests mac_ask_help",
  "cargo run --locked -p xtask --no-default-features -- campaign check apple-m4-slm-hardening",
  "cargo run --locked -p xtask --no-default-features -- campaign doctor",
  "cargo run --locked -p xtask --no-default-features -- campaign generate --check",
  "git diff --check",
]
allowed_paths = [
  ".codex/campaigns/apple-m4-slm-hardening/**",
  "crates/bitnet-cli/src/main.rs",
  "crates/bitnet-cli/src/mac.rs",
  "crates/bitnet-cli/tests/**",
  "docs/slm/**",
  "docs/tracking/campaigns/apple-m4-slm-hardening/**",
  "docs/tracking/generated/**",
  "xtask/src/campaign.rs",
]
forbidden_paths = [
  "crates/bitnet-quantization/src/qk256/**",
  "crates/bitnet-qk256-dispatch/**",
  "crates/bitnet-server/**",
  "crates/bitnet-kernels/src/metal/**",
  "models/**",
]
may_claim = [
  "The default Mac SLM local-answer command accepts a positional question.",
  "The existing --question form remains compatible.",
  "The default verified Qwen2.5 cache flow and apple-m4-cpu-neon boundary are preserved.",
]
must_not_claim = [
  "BitNet local-answer quality is proven.",
  "Full apple-m4-metal inference works.",
  "MPSGraph or Neural Engine model inference works.",
  "QK256 works on Apple Silicon.",
  "Broad M4 performance is proven.",
]

