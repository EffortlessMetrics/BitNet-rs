id = "apple-m4-slm-eval-and-proof"
title = "Apple M4 dense SLM eval and proof"
status = "active"

objective = "Turn the usable Apple M4 dense SLM path into a structured, receipt-backed local model runner proof with seeded quality eval, first-class speed/stability metrics, per-model reports, and lightweight regression economics without broad benchmark claims."

end_state = [
  "A seeded deterministic dense SLM eval corpus is defined and parser-validated.",
  "Accuracy scoring supports exact match, normalized match, JSON/schema-style checks, numeric tolerance, required keywords, and forbidden-token checks without relying on open-ended judgment.",
  "Per-model M4 dense SLM reports record model hash, tokenizer authority, prompt template, backend, fallback status, generated text/token IDs coverage, timing percentiles, memory, and claim boundaries.",
  "All supported dense M4 model IDs can be evaluated through the same artifact, tokenizer, cache, receipt, and report contract.",
  "Advisory/nightly/release CI tiers keep live M4 model runs out of generic required PR CI while still producing durable evidence.",
  "`bitnet mac regression` can compare matching dense SLM eval reports over time.",
]

hard_constraints = [
  "This is an M4 Mac mini dense SLM campaign.",
  "Do not reopen completed apple-m4, apple-m4-operational, apple-m4-slm-answer, apple-m4-productization, apple-m4-slm-performance, apple-m4-slm-excellence, apple-m4-slm-hardening, apple-m4-continuity, or apple-m4-dense-slm-regression campaigns.",
  "Do not use dense Qwen evidence as BitNet local-answer evidence.",
  "Do not claim broad model quality or broad Apple Silicon benchmark performance.",
  "Do not claim full apple-m4-metal inference, QK256 support, Neural Engine execution, MPSGraph model inference, or MacBook evidence.",
  "Do not add live model downloads, hardware timing runs, or long resident soaks to generic required PR CI.",
  "Never commit model binaries.",
]

[[work_item]]
id = "M4-SLM-EVAL-001"
status = "in_progress"
branch = "codex/apple-m4-slm-eval-and-proof/M4-SLM-EVAL-001-seeded-corpus"
stackable = false
review_mode = "codex_premerge"
merge_policy = "automerge_when_green"
human_gate = "on_blocker_only"
blocked_by = []
acceptance = "Define the apple-m4-slm-eval-and-proof campaign and add a seeded, deterministic dense SLM eval corpus spec covering arithmetic, fixed-table QA, JSON-shaped output, closed-label classification, synthetic extraction, ordering/sorting, rewrite, constrained summary, and required/forbidden-token instruction following. Validate the corpus shape with the existing answer-corpus dry-run path, but do not claim runtime accuracy or broad model quality."
commands = [
  "cargo run --locked -p bitnet-cli --no-default-features --features cpu,full-cli --bin bitnet -- answer-corpus --dry-run --corpus ci/quality/apple-m4-slm-eval-seeded-corpus.yaml --model models/Qwen2.5-0.5B-Instruct-GGUF/qwen2.5-0.5b-instruct-q8_0.gguf --json-out target/apple-m4-slm-eval-and-proof/seeded-corpus-dry-run.json",
  "jq -e '.artifact_kind == \"slm_cpu_answer_corpus\" and .corpus.case_count == 10 and .quality_summary.not_run == 10 and .quality_summary.failed == 0 and .quality_summary.timeout == 0' target/apple-m4-slm-eval-and-proof/seeded-corpus-dry-run.json",
  "cargo run --locked -p xtask --no-default-features -- campaign check apple-m4-slm-eval-and-proof",
  "cargo run --locked -p xtask --no-default-features -- campaign doctor",
  "cargo run --locked -p xtask --no-default-features -- campaign generate --check",
  "git diff --check",
]
allowed_paths = [
  "ci/quality/apple-m4-slm-eval-seeded-corpus.yaml",
  "docs/slm/apple-m4-slm-eval-and-proof.md",
  "docs/tracking/campaigns/apple-m4-slm-eval-and-proof/**",
  "docs/tracking/generated/**",
]
forbidden_paths = [
  "crates/bitnet-quantization/src/qk256/**",
  "crates/bitnet-qk256-dispatch/**",
  "crates/bitnet-server/**",
  "crates/bitnet-kernels/src/metal/**",
  "models/**",
]
may_claim = [
  "A seeded deterministic dense SLM eval corpus spec exists and parses through the answer-corpus dry-run path.",
]
must_not_claim = [
  "Runtime dense SLM accuracy is proven by this item.",
  "Broad model quality is proven.",
  "Broad M4 performance is proven.",
  "BitNet local-answer quality is proven.",
  "Full apple-m4-metal inference works.",
  "QK256 works on Apple Silicon.",
  "Neural Engine execution is proven.",
  "MPSGraph inference is proven.",
]

