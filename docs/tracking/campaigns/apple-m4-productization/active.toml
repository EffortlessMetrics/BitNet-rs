]
may_claim = [
  "The working Rust-native Apple M4 CPU/NEON SLM local-answer baseline is documented.",
  "Dense SLM Mac productization is separated from blocked BitNet local-answer quality.",
]
must_not_claim = [
  "BitNet local-answer quality is proven.",
  "Full apple-m4-metal inference works.",
  "Neural Engine execution is proven.",
  "QK256 works on Apple Silicon.",
  "General M4 performance is proven.",
]

