  - id: NPU-003
    title: Add Intel NPU runtime detection
    state: proposed
    priority: P1
    workstream: npu
    depends_on:
      - NPU-002
    scope:
      allowed_paths:
        - crates/bitnet-device-probe/src/**
        - crates/bitnet-device-probe/Cargo.toml
        - docs/tracking/bitnet-alignment/backend-status.yaml
        - docs/tracking/bitnet-alignment/status.md
        - docs/tracking/bitnet-alignment/workstream-ledger.yaml
      forbidden_paths:
        - crates/bitnet-quantization/src/qk256/**
        - crates/bitnet-qk256-dispatch/**
    acceptance:
      - Probe reports accel device-node presence separately from kernel driver and runtime availability.
      - Probe searches for NPU and VPU language, including intel_vpu where the OS exposes that driver hint.
      - Probe supports Windows-native artifacts early and does not assume WSL can see the NPU.
      - Probe reports OpenVINO runtime presence, runtime version when available, and NPU device visibility.
      - Probe records OpenVINO available devices, NPU full device name, driver version, compiler version, memory properties, and max tiles when they can be discovered.
      - npu feature builds without requiring OpenVINO to be installed.
      - BITNET_NPU_FAKE=intel is allowed only outside strict mode.
      - Strict mode ignores fake detection controls.
    verification:
      - cargo fmt --all -- --check
      - cargo test --locked -p bitnet-device-probe --no-default-features --features npu

  - id: NPU-004
    title: Add Intel NPU smoke probe command
    state: proposed
    priority: P1
    workstream: npu
    depends_on:
