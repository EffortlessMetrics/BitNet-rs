    acceptance:
      - Smoke command emits machine-readable Intel NPU detection output without running model inference.
      - Output records requested backend, selected backend, strict mode, fallback use, accel device-node presence, intel_vpu or driver hint, OpenVINO runtime presence, OpenVINO version, available devices, and OpenVINO NPU visibility.
      - Non-NPU machines can report unavailable without claiming failure of CPU support.
    verification:
      - cargo fmt --all -- --check
      - cargo test --locked -p bitnet-cli --no-default-features --features cpu,npu,full-cli

  - id: NPU-005
    title: Run tiny OpenVINO NPU graph smoke
    state: proposed
    priority: P1
    workstream: npu
    depends_on:
      - NPU-004
    scope:
      allowed_paths:
        - crates/bitnet-kernels/src/npu/**
        - crates/bitnet-kernels/Cargo.toml
        - crates/bitnet-device-probe/**
        - docs/tracking/bitnet-alignment/backend-status.yaml
        - docs/tracking/bitnet-alignment/status.md
        - docs/tracking/bitnet-alignment/workstream-ledger.yaml
      forbidden_paths:
        - crates/bitnet-quantization/src/qk256/**
        - crates/bitnet-qk256-dispatch/**
        - crates/bitnet-server/**
    acceptance:
      - Static-shape F16 tiny matmul graph is compiled through OpenVINO to runtime device NPU.
      - Tiny graph executes on Intel NPU through OpenVINO.
      - Strict mode fails the smoke test if CPU fallback is used.
      - Smoke output records requested_backend=intel-npu, selected_backend=intel-npu-openvino, graph name, precision, shape contract, fallback use, and result.
      - Backend status moves beyond scaffold only after a real Lunar Lake artifact exists.
    verification:
      - cargo fmt --all -- --check
      - Manual Lunar Lake Intel NPU smoke command with receipt artifact.

  - id: NPU-006
    title: Record backend identity and fallback in receipts
    state: proposed
    priority: P1
    workstream: npu
    depends_on:
