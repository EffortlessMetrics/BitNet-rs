    acceptance:
      - npu no longer maps to Metal, CUDA, or generic GPU.
      - npu, intel-npu, intel-npu index syntax, and openvino-npu aliases preserve requested Intel NPU identity.
      - Proof labels distinguish intel-npu-openvino from intel-gpu-opencl and CPU variants.
      - Future selected backend label is reserved as intel-npu-openvino with runtime device NPU.
      - Strict mode fails before inference when Intel NPU is requested but unavailable.
      - CLI and config help text describe Intel NPU honestly.
    verification:
