      - Claim boundaries distinguish device-node detection, runtime smoke, BitNet subgraph parity, full inference, and performance.
      - OpenVINO NPU is named as the first implementation target, not oneAPI/OpenCL or a handwritten KernelProvider.
      - CPU fallback and QK256 CPU execution cannot count as Intel NPU execution.
      - Follow-up items are split into backend identity, runtime detection, CLI smoke, OpenVINO tiny graph smoke, receipt fields, BitNet subgraph parity, and OpenVINO llama.cpp GGUF reference evaluation.
