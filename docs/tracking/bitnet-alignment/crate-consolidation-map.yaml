schema: 1
policy:
  keep_crate_if:
    - public_package_boundary
    - binary_or_tool_boundary
    - abi_or_linking_boundary
    - heavy_optional_dependency_boundary
    - platform_packaging_boundary
    - independently_useful_external_api
  otherwise: merge_into_owner_crate_as_srp_module

destinations:
  bitnet:
    target_modules:
      - facade
      - examples
      - workspace_tests

  bitnet-common:
    target_modules:
      - math
      - warn_once
      - atomic_file
      - threading
      - runtime/context
      - runtime/feature_flags
      - runtime/profile
      - runtime/startup_contract

  bitnet-tokenizers:
    target_modules:
      - discovery
      - merge
      - model
      - text
      - prompt_templates

  bitnet-models:
    target_modules:
      - gguf
      - safetensors
      - compatibility
      - validation
      - weight_names
      - download
      - transformer
      - trace

  bitnet-quantization:
    target_modules:
      - bits
      - qk256/layout
      - qk256/dispatch

  bitnet-kernels:
    target_modules:
      - cpu/detect
      - cpu/activations
      - cpu/simd
      - gpu/hal
      - gpu/cuda
      - gpu/metal
      - gpu/vulkan
      - gpu/opencl
      - gpu/rocm
      - gpu/wgpu
      - dispatch
      - shaders

  bitnet-inference:
    target_modules:
      - logits
      - logits/filters
      - probability
      - sampling
      - generation
      - generation/events
      - generation/stop
      - kv_cache/policy
      - engine/state
      - session/config
      - metrics
      - repl
      - scoring
      - eval
      - tool_use

  bitnet-receipts:
    target_modules:
      - schema
      - honest_compute
      - benchmark
      - regression

  bitnet-server:
    target_modules:
      - api_versioning
      - api_key_auth
      - client_ip
      - http_auth
      - http_retry
      - request_context
      - health/types

  bitnet-testkit:
    target_modules:
      - env
      - fixtures
      - bdd
      - feature_matrix
      - policy
      - scenarios
      - snapshots
      - profile

  bitnet-tools:
    target_modules:
      - xtask
      - task_runner
      - migration
      - fuzz
      - crossval
      - safetensors_tools


crates:
  bitnet:
    path: Cargo.toml
    disposition: keep
    destination: bitnet
    module: facade
    wave: public
    risk: high
    reason: root public facade and package boundary
    verification_gate: Focused public crate checks; no collapse gate unless disposition changes

  bitnet-atomic-file-core:
    path: crates/bitnet-atomic-file-core/Cargo.toml
    disposition: merge
    destination: bitnet-common
    module: atomic_file
    wave: leaf
    risk: low
    reason: pure file utility without independent runtime boundary
    verification_gate: Gate 2 focused crate-collapse checks for bitnet-common

