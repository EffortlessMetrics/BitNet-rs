schema: 1
hardware_profile: 5070ti_16gb
tiers:
  tier_a_local:
    meaning: Reasonable to smoke locally with small/quantized models or CPU/GPU offload.
    families: [gemma4_e2b_e4b_text_only, qwen35_0_8b_2b_4b_9b, openai_privacy_filter]
  tier_b_partial:
    meaning: May run with quantization, CPU/RAM offload, reduced context, or single-token proof only.
    families: [qwen36_27b, qwen35_27b_35b_a3b, gemma4_26b_a4b_31b_quantized, mistral_medium_35_external_or_offload]
  tier_c_design_only:
    meaning: Too large for direct local proof; document architecture, prompt, loader, receipts, and reference commands.
    families: [kimi_k26, glm51, deepseek_v4_flash_pro, mistral_medium_35_128b_full_path]
non_claims:
  - Design-only docs are not local inference claims.
  - Tier labels are not benchmark claims.
  - Source context length is not bitnet-rs long-context proof.

