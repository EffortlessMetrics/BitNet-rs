# ripr — static oracle-gap analysis for BitNet-rs
#
# ripr asks whether changed Rust behavior appears gripped by a meaningful test
# discriminator. It is mutation-testing-lite at static-analysis prices. It does
# not run mutants and does not replace mutation testing.
#
# The repository runs ripr in advisory PR-evidence mode; public README badges use
# repo-scoped badge formats and PR artifacts remain diff-scoped.

[analysis]
mode = "draft"
include_unchanged_tests = true

[oracles]
snapshot_strength = "medium"
mock_expectation_strength = "medium"
broad_error_strength = "weak"

[severity.findings]
exposed = "info"
weakly_exposed = "warning"
reachable_unrevealed = "warning"
no_static_path = "warning"
infection_unknown = "warning"
propagation_unknown = "note"
static_unknown = "note"

[severity.seams]
strongly_gripped = "off"
weakly_gripped = "warning"
ungripped = "warning"
reachable_unrevealed = "warning"
activation_unknown = "info"
propagation_unknown = "info"
observation_unknown = "info"
discrimination_unknown = "info"
opaque = "info"
intentional = "off"
suppressed = "off"

[lsp]
seam_diagnostics = true

[reports]
max_related_tests = 8

[suppressions]
path = ".ripr/suppressions.toml"
