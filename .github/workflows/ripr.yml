name: ripr

on:
  pull_request:
    paths:
      - "crates/**/*.rs"
      - "src/**/*.rs"
      - "ripr.toml"
      - "policy/ripr-suppressions.toml"
      - "scripts/ripr-annotations.py"
      - ".github/workflows/ripr.yml"
  workflow_dispatch:

concurrency:
  group: ripr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ripr-advisory:
    name: ripr PR evidence
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6  # stable
        with:
          toolchain: "1.95.0"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0  # v2
        with:
          cache-on-failure: true

      - name: Install ripr
        run: cargo install ripr --locked

      - name: Fetch base branch
        if: github.base_ref != ''
        run: git fetch origin ${{ github.base_ref }}

      - name: RIPR PR evidence
        id: ripr_pr
        run: cargo xtask ripr-pr

      - name: RIPR review guidance
        id: ripr_review
        run: cargo xtask ripr-review-comments --base "origin/${{ github.base_ref }}" --head HEAD

      - name: RIPR PR contract
        if: always()
        run: cargo xtask ripr-pr --check

      - name: RIPR review contract
        if: always()
        run: cargo xtask ripr-review-comments --check

      - name: RIPR review summary
        if: always()
        shell: bash
        run: |
          {
            echo "## RIPR Review Guidance"
            echo
            if [ -f target/ripr/review/comments.md ]; then
              cat target/ripr/review/comments.md
            else
              echo "No RIPR review guidance was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: RIPR annotations
        if: always()
        run: python scripts/ripr-annotations.py

      - name: Upload RIPR PR evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: ripr-pr
          path: target/ripr/pr
          if-no-files-found: warn
          retention-days: 14

      - name: Upload RIPR review guidance
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: ripr-review
          path: target/ripr/review
          if-no-files-found: warn
          retention-days: 14
