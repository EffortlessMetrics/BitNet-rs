name: ripr

on:
  pull_request:
    paths:
      - "crates/**/*.rs"
      - "src/**/*.rs"
      - "xtask/**"
      - "scripts/ripr-annotations.py"
      - "ripr.toml"
      - "policy/ripr-suppressions.toml"
      - ".github/workflows/ripr.yml"
  workflow_dispatch:

concurrency:
  group: ripr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ripr-advisory:
    name: ripr static exposure
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6  # stable
        with:
          toolchain: "1.95.0"

      - name: Locate ripr binary
        id: locate
        run: |
          if command -v ripr >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "ripr already on PATH"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "ripr binary is not yet provisioned for this runner."
            echo "RIPR PR evidence is advisory: when the binary is absent,"
            echo "the workflow records that fact and exits 0."
          fi

      - name: Fetch base branch
        if: steps.locate.outputs.available == 'true' && github.base_ref != ''
        run: git fetch origin "${{ github.base_ref }}"

      - name: Run ripr doctor
        if: steps.locate.outputs.available == 'true'
        run: ripr doctor || true

      - name: RIPR PR evidence
        if: steps.locate.outputs.available == 'true'
        env:
          RIPR_BASE: origin/${{ github.base_ref }}
          RIPR_HEAD: HEAD
        run: cargo xtask ripr-pr

      - name: RIPR review guidance
        if: steps.locate.outputs.available == 'true'
        env:
          RIPR_BASE: origin/${{ github.base_ref }}
          RIPR_HEAD: HEAD
        run: cargo xtask ripr-review-comments

      - name: RIPR PR contract
        if: always() && steps.locate.outputs.available == 'true'
        run: |
          cargo xtask ripr-pr --check
          cargo xtask ripr-review-comments --check

      - name: RIPR review summary
        if: always()
        run: |
          {
            echo "## RIPR Review Guidance"
            echo ""
            if [ "${{ steps.locate.outputs.available }}" != "true" ]; then
              echo "_ripr binary not provisioned on this runner; advisory output skipped._"
              echo ""
              echo "See \`docs/RIPR_EVIDENCE_POLICY.md\` for the rollout posture."
            elif [ -f target/ripr/review/comments.md ]; then
              cat target/ripr/review/comments.md
            else
              echo "No RIPR review guidance was produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: RIPR annotations
        if: always() && steps.locate.outputs.available == 'true'
        run: python scripts/ripr-annotations.py

      - name: Upload RIPR PR evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: ripr-pr
          path: target/ripr/pr
          if-no-files-found: warn
          retention-days: 14

      - name: Upload RIPR review guidance
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: ripr-review
          path: target/ripr/review
          if-no-files-found: warn
          retention-days: 14
