name: ripr

on:
  pull_request:
    paths:
      - "crates/**/*.rs"
      - "src/**/*.rs"
      - "ripr.toml"
      - "policy/ripr-suppressions.toml"
      - ".github/workflows/ripr.yml"
  workflow_dispatch:

concurrency:
  group: ripr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ripr-advisory:
    name: ripr static exposure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6  # stable
        with:
          toolchain: "1.95.0"

      - name: Install ripr
        run: cargo install ripr --locked

      - name: Run ripr doctor
        run: ripr doctor || true

      - name: Run ripr check JSON (advisory)
        run: |
          mkdir -p target/ripr
          ripr check --root . --base "origin/${{ github.base_ref }}" --format json > target/ripr/ripr.json || true

      - name: Run ripr check GitHub summary (advisory)
        run: |
          ripr check --root . --base "origin/${{ github.base_ref }}" --format github > target/ripr/ripr.md || true

      - name: Run ripr check SARIF (advisory)
        run: |
          if timeout 25s ripr check --root . --base "origin/${{ github.base_ref }}" --format sarif > target/ripr/ripr.sarif; then
            echo "ripr SARIF generated"
          else
            status=$?
            echo "ripr SARIF generation timed out or failed with status ${status}; writing advisory fallback."
            cat > target/ripr/ripr.sarif <<'JSON'
          {
            "version": "2.1.0",
            "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
            "runs": [
              {
                "tool": {
                  "driver": {
                    "name": "ripr",
                    "rules": []
                  }
                },
                "results": [],
                "invocations": [
                  {
                    "executionSuccessful": false,
                    "toolExecutionNotifications": [
                      {
                        "level": "warning",
                        "message": {
                          "text": "ripr SARIF generation timed out or failed; JSON and markdown advisory artifacts remain authoritative for this job."
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          }
          JSON
          fi

      - name: Step summary
        if: always()
        run: |
          {
            echo "## ripr — static oracle-gap analysis (advisory)"
            echo ""
            if [ -f target/ripr/ripr.md ]; then
              cat target/ripr/ripr.md
            else
              echo "_ripr produced no markdown report._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ripr artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ripr-reports
          path: target/ripr/
          if-no-files-found: ignore
          retention-days: 14
