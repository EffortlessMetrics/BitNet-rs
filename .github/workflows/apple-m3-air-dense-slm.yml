name: Apple M3 Air Dense SLM Evidence (staged)

on:
  workflow_dispatch:
    inputs:
      enable_run:
        description: "Run on the provisioned M3 MacBook Air hardware lane. Leave false for a dry staged dispatch."
        required: true
        type: boolean
        default: false
      profile_set:
        description: "M3 dense SLM profile to run."
        required: true
        type: choice
        default: "smoke"
        options:
          - smoke
          - accuracy
          - operator
      model_id:
        description: "Supported dense SLM model cache id."
        required: true
        type: string
        default: "qwen2.5-0.5b-instruct-q8_0"
      corpus:
        description: "Comparison corpus for M3 dense SLM validation."
        required: true
        type: string
        default: "ci/quality/apple-m4-slm-quality-corpus.yaml"
      corpus_repeat_runs:
        description: "Repeat count for comparison-grade corpus prompts."
        required: true
        type: string
        default: "2"
      max_new_tokens:
        description: "Maximum generated tokens per prompt."
        required: true
        type: string
        default: "32"
      min_free_gb:
        description: "Minimum free disk required before model fetch and receipt generation."
        required: true
        type: string
        default: "16"
      retention_days:
        description: "Artifact retention days for receipt bundles."
        required: true
        type: string
        default: "30"
      report_pr:
        description: "Optional PR number to mention in the run summary."
        required: false
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  RUST_LOG: warn
  BITNET_MODEL_CACHE_DIR: ${{ github.workspace }}/target/apple-m3-air-dense-slm/model-cache
  M3_AIR_ARTIFACT_ROOT: ${{ github.workspace }}/target/apple-m3-air-dense-slm/${{ github.run_id }}

jobs:
  staged-message:
    name: Staged hardware workflow is not active
    if: ${{ inputs.enable_run != true }}
    runs-on: ubuntu-22.04
    steps:
      - name: Explain staged status
        run: |
          {
            echo "## Apple M3 Air Dense SLM Evidence"
            echo
            echo "This workflow is staged only. It does not run the M3 Air hardware lane until explicitly dispatched with enable_run=true."
            echo
            echo "To run on the M3 Air lane, dispatch again with:"
            echo
            echo "- enable_run=true"
            echo "- self-hosted runner labels: self-hosted, macOS, ARM64, apple-m3-air-dense-slm"
          } >> "$GITHUB_STEP_SUMMARY"

  apple-m3-air-dense-slm:
    name: Apple M3 Air Dense SLM Receipt
    if: ${{ inputs.enable_run == true }}
    runs-on: [self-hosted, macOS, ARM64, apple-m3-air-dense-slm]
    timeout-minutes: 180
    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6 # stable
        with:
          toolchain: "1.95.0"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0 # v2
        with:
          shared-key: apple-m3-air-dense-slm

      - name: Prepare artifact directories and check disk
        run: |
          set -euo pipefail
          mkdir -p "$M3_AIR_ARTIFACT_ROOT" "$BITNET_MODEL_CACHE_DIR"
          FREE_KB="$(df -Pk "$BITNET_MODEL_CACHE_DIR" | awk 'NR == 2 { print $4 }')"
          MIN_FREE_KB="$(( ${{ inputs.min_free_gb }} * 1024 * 1024 ))"
          {
            echo "{"
            echo "  \"artifact_kind\": \"apple_m3_air_dense_slm_preflight\","
            echo "  \"machine_id\": \"apple-m3-macbook-air\","
            echo "  \"model_cache_root\": \"$BITNET_MODEL_CACHE_DIR\","
            echo "  \"available_kb\": $FREE_KB,"
            echo "  \"min_required_kb\": $MIN_FREE_KB,"
            echo "  \"profile_set\": \"${{ inputs.profile_set }}\","
            echo "  \"model_id\": \"${{ inputs.model_id }}\","
            echo "  \"branch\": \"${GITHUB_REF_NAME}\","
            echo "  \"commit\": \"${GITHUB_SHA}\","
            echo "  \"report_pr\": \"${{ inputs.report_pr }}\""
            echo "}"
          } > "$M3_AIR_ARTIFACT_ROOT/preflight.json"
          if [ "$FREE_KB" -lt "$MIN_FREE_KB" ]; then
            echo "Apple M3 Air dense SLM evidence skipped: low disk. Free KB=$FREE_KB required KB=$MIN_FREE_KB" >&2
            exit 1
          fi

      - name: Record host context
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$M3_AIR_ARTIFACT_ROOT"
          {
            echo "{"
            echo "  \"artifact_kind\": \"apple_m3_air_dense_slm_host_context\","
            echo "  \"sw_vers\": $(sw_vers | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))'),"
            echo "  \"hardware\": $(system_profiler SPHardwareDataType SPPowerDataType | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')"
            echo "}"
          } > "$M3_AIR_ARTIFACT_ROOT/host-context.json"

      - name: Upload M3 Air preflight evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apple-m3-air-dense-slm-preflight-${{ github.run_id }}
          path: ${{ env.M3_AIR_ARTIFACT_ROOT }}
          if-no-files-found: warn
          retention-days: ${{ inputs.retention_days }}

      - name: Fetch and verify supported dense SLM model
        id: fetch_verify
        run: |
          set -euo pipefail
          cargo run --release --locked -p bitnet-cli --no-default-features --features cpu,full-cli -- \
            model fetch "${{ inputs.model_id }}"
          cargo run --release --locked -p bitnet-cli --no-default-features --features cpu,full-cli -- \
            model verify "${{ inputs.model_id }}"

      - name: Record model fetch phase
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$M3_AIR_ARTIFACT_ROOT"
          {
            echo "{"
            echo "  \"artifact_kind\": \"apple_m3_air_dense_slm_model_fetch_phase\","
            echo "  \"machine_id\": \"apple-m3-macbook-air\","
            echo "  \"model_id\": \"${{ inputs.model_id }}\","
            echo "  \"fetch_verify_outcome\": \"${{ steps.fetch_verify.outcome }}\","
            echo "  \"profile_set\": \"${{ inputs.profile_set }}\","
            echo "  \"branch\": \"${GITHUB_REF_NAME}\","
            echo "  \"commit\": \"${GITHUB_SHA}\""
            echo "}"
          } > "$M3_AIR_ARTIFACT_ROOT/model-fetch-verify.json"

      - name: Upload M3 Air model-fetch evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apple-m3-air-dense-slm-model-fetch-${{ github.run_id }}
          path: ${{ env.M3_AIR_ARTIFACT_ROOT }}
          if-no-files-found: warn
          retention-days: ${{ inputs.retention_days }}

      - name: Run M3 Air dense SLM receipt
        run: |
          set -euo pipefail
          EXTRA_FLAGS=""
          if [ "${{ inputs.profile_set }}" = "operator" ]; then
            EXTRA_FLAGS="--allocation-audit"
          fi
          cargo run --release --locked -p bitnet-cli --no-default-features --features cpu,full-cli -- \
            mac validate \
            --device apple-m3-air-cpu-neon \
            --profile-set "${{ inputs.profile_set }}" \
            --model-id "${{ inputs.model_id }}" \
            --corpus "${{ inputs.corpus }}" \
            --corpus-repeat-runs "${{ inputs.corpus_repeat_runs }}" \
            --max-new-tokens "${{ inputs.max_new_tokens }}" \
            --cache-dir "$BITNET_MODEL_CACHE_DIR" \
            --json-out "$M3_AIR_ARTIFACT_ROOT/m3-air-dense-slm-${{ inputs.profile_set }}.json" \
            --quiet \
            $EXTRA_FLAGS

      - name: Check M3 Air dense SLM receipt
        run: |
          set -euo pipefail
          cargo run --locked -p bitnet-cli --no-default-features --features cpu,full-cli -- \
            mac receipts-check "$M3_AIR_ARTIFACT_ROOT/m3-air-dense-slm-${{ inputs.profile_set }}.json" \
            --json > "$M3_AIR_ARTIFACT_ROOT/m3-air-dense-slm-${{ inputs.profile_set }}.receipts-check.json"

      - name: Write run summary
        if: always()
        run: |
          {
            echo "## Apple M3 Air Dense SLM Evidence"
            echo
            echo "- Branch: \`${GITHUB_REF_NAME}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Optional PR: \`${{ inputs.report_pr }}\`"
            echo "- Artifact root: \`$M3_AIR_ARTIFACT_ROOT\`"
            echo "- Model id: \`${{ inputs.model_id }}\`"
            echo "- Profile set: \`${{ inputs.profile_set }}\`"
            echo
            echo "The run records M3 MacBook Air dense Qwen Apple CPU/NEON evidence only. It does not claim BitNet answer quality, M4 Mac mini performance, full Metal inference, Neural Engine execution, MPSGraph model inference, QK256 support, or broad Apple Silicon performance."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload M3 Air dense SLM evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apple-m3-air-dense-slm-${{ inputs.profile_set }}-${{ github.run_id }}
          path: ${{ env.M3_AIR_ARTIFACT_ROOT }}
          if-no-files-found: warn
          retention-days: ${{ inputs.retention_days }}
