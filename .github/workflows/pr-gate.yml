name: PR Gate

# PR Gate Success — the single required check that branch protection
# should gate merges on. The job consumes `xtask ci plan` and waits for
# the selected blocking lanes instead of maintaining its own path
# classifier.
#
# Posture in this PR:
#
#   * The workflow runs on every pull_request and emits a single
#     "PR Gate Success" check.
#   * It is *not* yet wired into branch protection. The migration
#     (`Settings -> Branches -> main -> Required status checks`)
#     happens in a separate change once one full sprint of these
#     conclusions has been observed.
#   * Until then, the existing `ci-core-success` summary remains
#     the source of truth for branch protection.
#
# Aggregation strategy:
#
#   GitHub Actions does not allow `needs:` across workflows in the
#   same `pull_request` event. Two pragmatic options exist:
#
#     a) `workflow_run` trigger: spawns a follow-up after each upstream
#        workflow completes. Loses the "single check on the PR" UX.
#     b) A dedicated job in this workflow that polls the GitHub
#        Checks API for the upstream conclusions on the same head SHA.
#
#   This PR uses option (b) because branch protection wants a single
#   required check that returns a single conclusion on the PR head.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pr-gate-${{ github.ref }}
  # The gate polls upstream jobs and should outlive selected long lanes.
  # Let started gates finish rather than discarding near-complete CI evidence.
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read

jobs:
  pr-gate-success:
    name: PR Gate Success
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6  # stable
        with:
          toolchain: "1.95.0"

      - name: Determine head SHA
        id: head
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          FALLBACK: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha="${PR_HEAD:-$FALLBACK}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Head SHA: $sha"

      - name: Compute changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ steps.head.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_SHA:-}" ] && git cat-file -e "$BASE_SHA" 2>/dev/null; then
            git diff --name-only "$BASE_SHA"..."$HEAD_SHA" > changed.txt || true
          else
            git diff --name-only HEAD~1..HEAD > changed.txt || true
          fi
          count=$(wc -l < changed.txt | tr -d ' ')
          echo "Changed files ($count) considered by PR Gate:"
          sed -n '1,200p' changed.txt

      - name: Build PR gate CI plan
        timeout-minutes: 10
        env:
          LABELS: ${{ github.event_name == 'pull_request' && toJson(github.event.pull_request.labels.*.name) || '[]' }}
        run: |
          set -euo pipefail
          labels="${LABELS:-[]}"
          if [ "$labels" = "null" ]; then
            labels="[]"
          fi
          cargo run --locked -p xtask --no-default-features -- ci plan \
            --changed-file changed.txt \
            --labels-json "$labels" \
            --json-out ci-plan.json \
            --github-summary "$GITHUB_STEP_SUMMARY" \
            --print

      - name: Wait for upstream lanes
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          HEAD_SHA: ${{ steps.head.outputs.sha }}
          LABELS: ${{ github.event_name == 'pull_request' && toJson(github.event.pull_request.labels.*.name) || '[]' }}
        run: |
          set -euo pipefail

          test -f ci-plan.json

          labels="${LABELS:-[]}"
          if [ "$labels" = "null" ]; then
            labels="[]"
          fi
          pr_size_acknowledged=false
          if printf '%s' "$labels" | jq -e 'index("mechanical-change") or index("ai-native")' >/dev/null; then
            pr_size_acknowledged=true
          fi

          echo "Selected blocking lanes from ci-plan.json:"
          jq -r '.selected_lanes[] | select(.blocking == true) | "  - \(.id): \(.name)"' ci-plan.json

          echo "Selected advisory lanes from ci-plan.json (reported, not gating):"
          jq -r '.selected_lanes[] | select(.blocking == false) | "  - \(.id): \(.name)"' ci-plan.json

          required_jobs=()
          unknown_lanes=()
          while IFS= read -r lane_id; do
            [ -n "$lane_id" ] || continue
            case "$lane_id" in
              always-on-guards)
                required_jobs+=("Guards")
                if [ "$pr_size_acknowledged" = "true" ]; then
                  echo "Check PR Size is intentionally skipped by PR label; not adding it as a required upstream lane."
                else
                  required_jobs+=("Check PR Size")
                fi
                ;;
              bdd-grid-check)
                required_jobs+=("BDD Grid Check")
                ;;
              ci-core-build-test)
                required_jobs+=("CI Core Success")
                ;;
              compatibility-ffi-abi)
                required_jobs+=("ABI Stability Check")
                ;;
              compatibility-msrv)
                required_jobs+=("Route MSRV Compatibility" "Minimum Supported Rust Version")
                ;;
              compatibility-tokenizer)
                required_jobs+=("Tokenizer Compatibility Tests")
                ;;
              feature-matrix-pr)
                required_jobs+=(
                  "pr-check (no-features)"
                  "pr-check (cpu)"
                )
                ;;
              feature-matrix-full-cli)
                required_jobs+=("pr-check (cpu+full-cli)")
                ;;
              gpu-native)
                required_jobs+=(
                  "native-check (cpu)"
                  "native-check (gpu)"
                  "native-check (cpu+gpu)"
                  "native-check (oneapi)"
                  "native-check (cpu+oneapi)"
                )
                ;;
              policy)
                required_jobs+=("Policy")
                ;;
              *)
                unknown_lanes+=("$lane_id")
                ;;
            esac
          done < <(jq -r '.selected_lanes[] | select(.blocking == true) | .id' ci-plan.json)

          if [ ${#unknown_lanes[@]} -gt 0 ]; then
            echo "::error::PR Gate has no check mapping for selected blocking lane(s): ${unknown_lanes[*]}"
            exit 1
          fi

          if [ ${#required_jobs[@]} -gt 0 ]; then
            deduped=()
            declare -A seen=()
            for job in "${required_jobs[@]}"; do
              if [ -z "${seen[$job]+x}" ]; then
                deduped+=("$job")
                seen[$job]=1
              fi
            done
            required_jobs=("${deduped[@]}")
          fi

          if [ ${#required_jobs[@]} -eq 0 ]; then
            echo "No selected blocking upstream lanes are required for this PR."
            exit 0
          fi

          echo "Required upstream lanes:"
          printf '  - %s\n' "${required_jobs[@]}"

          # Poll for up to 55 minutes (110 * 30s). The gate must exceed
          # the healthy cap of the selected upstream lanes plus rollup and
          # status propagation cushion; otherwise it can fail after upstream
          # CI has spent most of its runtime but before it emits a result.
          deadline=$((SECONDS + 3300))
          api="repos/${OWNER}/${REPO}/commits/${HEAD_SHA}/check-runs"
          missing="${required_jobs[*]}"

          while [ $SECONDS -lt $deadline ]; do
            payload=$(gh api --paginate -H 'Accept: application/vnd.github+json' \
              "${api}?per_page=100" --jq '.check_runs[]' \
              | jq -s '{check_runs: .}' || true)
            if [ -z "$payload" ]; then
              echo "Empty API response; retrying"
              sleep 30
              continue
            fi

            pending=()
            failures=()
            for name in "${required_jobs[@]}"; do
              status=$(printf '%s' "$payload" | jq -r --arg n "$name" \
                '[.check_runs[]? | select(.name == $n)] | sort_by(.started_at) | last | .status // "missing"')
              conclusion=$(printf '%s' "$payload" | jq -r --arg n "$name" \
                '[.check_runs[]? | select(.name == $n)] | sort_by(.started_at) | last | .conclusion // ""')
              echo "  $name -> status=$status conclusion=$conclusion"
              if [ "$status" != "completed" ]; then
                pending+=("$name")
              elif [ "$conclusion" = "success" ]; then
                : # ok
              elif [ "$conclusion" = "skipped" ]; then
                # Required jobs must not be skipped.
                failures+=("$name (skipped)")
              else
                failures+=("$name ($conclusion)")
              fi
            done

            if [ ${#failures[@]} -gt 0 ]; then
              echo "❌ Required upstream lane(s) did not succeed:"
              for f in "${failures[@]}"; do echo "  - $f"; done
              exit 1
            fi
            if [ ${#pending[@]} -eq 0 ]; then
              echo "✅ All required upstream lanes succeeded"
              exit 0
            fi
            echo "Waiting for ${#pending[@]} upstream lane(s); checking again in 30s..."
            sleep 30
          done

          echo "❌ Timed out waiting for upstream lanes after 55 minutes"
          exit 1

      - name: Step summary
        if: always()
        env:
          OUTCOME: ${{ job.status }}
        run: |
          {
            echo "## PR Gate Success"
            echo ""
            echo "Gate outcome: \`${OUTCOME}\`"
            echo ""
            if [ -f ci-plan.json ]; then
              echo "### Selected blocking lanes"
              echo ""
              jq -r '.selected_lanes[] | select(.blocking == true) | "- `\(.id)` - \(.name)"' ci-plan.json
              echo ""
              echo "### Selected advisory lanes"
              echo ""
              jq -r '.selected_lanes[] | select(.blocking == false) | "- `\(.id)` - \(.name)"' ci-plan.json
            else
              echo "No ci-plan.json was produced."
            fi
            echo ""
            echo "_PR Gate Success is **not yet branch-protection-required**;"
            echo "it is consuming \`ci-plan.json\` in observation mode. See"
            echo "\`docs/ci/pr-gate-success.md\`._"
          } >> "$GITHUB_STEP_SUMMARY"
