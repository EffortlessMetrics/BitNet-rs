name: Coverage

on:
  push:
    branches: [ main ]   # enforce threshold on main
    paths:
      - 'crates/**'
      - 'crossval/**'
      - 'xtask/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/coverage.yml'
      - 'codecov.yml'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [ main ]
    paths:
      - 'crates/**'
      - 'crossval/**'
      - 'xtask/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/coverage.yml'
      - 'codecov.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/effortlessmetrics/bitnet-rs-ci:rust-1.95
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # PRs: only run when explicitly labeled "coverage" or "full-ci"
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'coverage') ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Disk usage before coverage
        run: df -h /

      - name: Generate coverage
        env:
          RUST_BACKTRACE: 1
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: |
          set -euo pipefail
          cargo llvm-cov clean --workspace
          cargo llvm-cov nextest --workspace --locked --no-default-features --features cpu --no-report --profile ci \
            --ignore-run-fail
          cargo llvm-cov report --json --output-path coverage.json
          cargo llvm-cov report --lcov --output-path lcov.info
          cargo llvm-cov report --text | tee coverage.txt

      - name: Disk usage after coverage
        if: always()
        run: |
          df -h /
          du -sh target/ || true

      - name: Enforce threshold on main (70%)
        if: github.event_name == 'push'
        run: |
          files=$(jq '.data[0].files | length // 0' coverage.json)
          lines=$(jq '.data[0].totals.lines.count // 0' coverage.json)
          if [ "$files" -eq 0 ] || [ "$lines" -eq 0 ]; then
            echo "::error::coverage.json is empty (0 files / 0 lines); coverage collection is misconfigured"
            exit 1
          fi
          perc=$(jq -r '.data[0].totals.lines.percent' coverage.json | awk '{print int($1+0.5)}')
          echo "Coverage: ${perc}%"
          if [ -z "$perc" ]; then echo "No coverage data"; exit 1; fi
          if [ "$perc" -lt 70 ]; then
            echo "Coverage below 70% on main (FAIL)"; exit 1
          fi
          echo "Coverage OK"

      - name: Write coverage receipt
        if: always()
        run: |
          mkdir -p target/bitnet/reports
          python3 - <<'PYTHON'
          import json
          import pathlib

          receipt = {
              "schema_version": 1,
              "repo": "bitnet-rs",
              "lane": "coverage",
              "flag": "rust-cpu",
              "workflow": "Coverage",
              "artifacts": {
                  "coverage_json": pathlib.Path("coverage.json").exists(),
                  "coverage_text": pathlib.Path("coverage.txt").exists(),
                  "lcov": pathlib.Path("lcov.info").exists(),
              },
              "claim_boundary": [
                  "execution_surface_only",
                  "cpu_path_only",
                  "not_gpu_validation",
                  "not_model_quality",
                  "not_crossval",
                  "not_mutation_adequacy",
              ],
          }
          pathlib.Path("target/bitnet/reports/coverage-receipt.json").write_text(
              json.dumps(receipt, indent=2) + "\n",
              encoding="utf-8",
          )
          PYTHON

      - name: Detect Codecov token
        id: codecov-token
        if: always()
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [ -n "${CODECOV_TOKEN:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload coverage reports to Codecov (main)
        if: ${{ always() && github.event_name == 'push' && hashFiles('lcov.info') != '' && steps.codecov-token.outputs.present == 'true' }}
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe  # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          flags: rust-cpu
          name: bitnet-rs-rust-cpu
          fail_ci_if_error: true

      - name: Upload coverage reports to Codecov (advisory PR)
        if: ${{ github.event_name != 'push' && hashFiles('lcov.info') != '' && steps.codecov-token.outputs.present == 'true' }}
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe  # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          flags: rust-cpu
          name: bitnet-rs-rust-cpu
          fail_ci_if_error: false

      - name: Upload coverage artifacts (always)
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: coverage-report
          path: |
            coverage.json
            coverage.txt
            lcov.info
            target/bitnet/reports/coverage-receipt.json
          retention-days: 7
