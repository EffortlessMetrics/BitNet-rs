name: Coverage

on:
  push:
    branches: [ main ]   # enforce threshold on main
    paths:
      - 'crates/**'
      - 'crossval/**'
      - 'xtask/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/coverage.yml'
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [ main ]
    paths:
      - 'crates/**'
      - 'crossval/**'
      - 'xtask/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/coverage.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 40

    # PRs: only run when explicitly labeled "coverage"
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'coverage')

    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift /usr/share/miniconda \
            /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/chromium \
            /usr/local/share/powershell /usr/share/az_* /opt/microsoft
          sudo docker image prune --all --force
          df -h /

      - uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6  # stable
        with:
          toolchain: "1.92.0"
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Disk usage before coverage
        run: df -h /

      - name: Generate coverage (single instrumented run via nextest)
        env:
          RUST_BACKTRACE: 1
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: |
          set -euo pipefail
          cargo llvm-cov clean --workspace
          cargo llvm-cov nextest --locked --no-default-features --features cpu --no-report --profile ci \
            --ignore-run-fail
          cargo llvm-cov --workspace report --json --output-path coverage.json
          cargo llvm-cov --workspace report --text | tee coverage.txt

      - name: Disk usage after coverage
        if: always()
        run: |
          df -h /
          du -sh target/ || true

      - name: Install jq
        if: github.event_name == 'push'
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Enforce threshold on main (70%)
        if: github.event_name == 'push'
        run: |
          files=$(jq '.data[0].files | length // 0' coverage.json)
          lines=$(jq '.data[0].totals.lines.count // 0' coverage.json)
          if [ "$files" -eq 0 ] || [ "$lines" -eq 0 ]; then
            echo "::error::coverage.json is empty (0 files / 0 lines); coverage collection is misconfigured"
            exit 1
          fi
          perc=$(jq -r '.data[0].totals.lines.percent' coverage.json | awk '{print int($1+0.5)}')
          echo "Coverage: ${perc}%"
          if [ -z "$perc" ]; then echo "No coverage data"; exit 1; fi
          if [ "$perc" -lt 70 ]; then
            echo "Coverage below 70% on main (FAIL)"; exit 1
          fi
          echo "Coverage OK"

      - name: Upload coverage artifacts (always)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: coverage-report
          path: |
            coverage.json
            coverage.txt
          retention-days: 7
