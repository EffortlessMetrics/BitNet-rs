name: CI (Core)

# Core gating checks that MUST pass for PR merges (Linux-only).
# This workflow is designed to be fast, reliable, and reproducible locally via ci/local.sh.
# Triggers include Rust inputs plus docs/policy/receipt surfaces that can use
# the no-Rust fast path. Repository rules may still expect this workflow's
# contexts before PR merges, so the workflow emits truthful success signals
# without compiling Rust when no Rust inputs changed.
#
# CI cost / verification policy: see docs/ci/cost-and-verification-policy.md
# (rationale for the well-below-$1-per-PR target and the verification ladder).

on:
  pull_request:
    branches: [ main ]
    paths:
      # Rust code and build files - always trigger core checks
      - 'crates/**'
      - 'crossval/**'
      - 'tests/**'
      - 'tools/bitnet-task/**'
      - 'xtask/**'
      - 'fuzz/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'Makefile'

      # Documentation, policy, and receipts handled by no-Rust fast paths
      - 'docs/**'
      - '*.md'
      - 'README*'
      - 'CHANGELOG*'
      - 'CONTRIBUTING*'
      - 'SECURITY*'
      - 'COMPATIBILITY*'
      - 'THIRD_PARTY*'
      - 'ci/hardware/**'
      - 'policy/**'

      # CI/Codex campaign definitions
      - '.codex/campaigns/**'

      # Workflow files - core and related CI workflows
      - '.github/workflows/ci-core.yml'
      - '.github/workflows/pr-plan.yml'
      - '.github/workflows/coverage.yml'

      # CI configuration - codecov config affects verification signal
      - 'codecov.yml'
  push:
    branches: [ main ]
    paths:
      - 'crates/**'
      - 'crossval/**'
      - 'tests/**'
      - 'tools/bitnet-task/**'
      - 'xtask/**'
      - 'docs/**'
      - '*.md'
      - 'README*'
      - 'CHANGELOG*'
      - 'CONTRIBUTING*'
      - 'SECURITY*'
      - 'COMPATIBILITY*'
      - 'THIRD_PARTY*'
      - 'ci/hardware/**'
      - 'policy/**'
      - '.codex/campaigns/**'
      - 'fuzz/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'Makefile'
      - '.github/workflows/ci-core.yml'
      - '.github/workflows/pr-plan.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Core PR jobs compile and may feed cache state. Do not cancel an already
  # started run near completion; reject irrelevant work before it starts.
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

env:
  RUSTFLAGS: "-Dwarnings"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  BITNET_SKIP_SLOW_TESTS: "1"

jobs:
  classify-changes:
    name: Classify Changes
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      tracker_only: ${{ steps.classify.outputs.tracker_only }}
      no_rust_inputs: ${{ steps.classify.outputs.no_rust_inputs }}
      docs_only: ${{ steps.classify.outputs.docs_only }}
      tracker_or_campaign_only: ${{ steps.classify.outputs.tracker_or_campaign_only }}
      hardware_receipt_only: ${{ steps.classify.outputs.hardware_receipt_only }}
      policy_docs_only: ${{ steps.classify.outputs.policy_docs_only }}
      fast_path_checks_required: ${{ steps.classify.outputs.fast_path_checks_required }}
      changed_files: ${{ steps.classify.outputs.changed_files }}
    steps:
      - name: Classify no-Rust PR shapes
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          tracker_only=false
          no_rust_inputs=false
          docs_only=false
          tracker_or_campaign_only=false
          hardware_receipt_only=false
          policy_docs_only=false
          fast_path_checks_required=false
          changed_files=""

          if [ "${EVENT_NAME}" = "pull_request" ] && [ -n "${PR_NUMBER:-}" ]; then
            changed_files=$(gh api --paginate \
              "repos/${OWNER}/${REPO}/pulls/${PR_NUMBER}/files" \
              --jq '.[].filename')
            echo "Changed files considered by CI Core:"
            printf '%s\n' "$changed_files"

            tracker_only=true
            no_rust_inputs=true
            docs_only=true
            tracker_or_campaign_only=true
            hardware_receipt_only=true
            policy_docs_only=true
            while IFS= read -r path; do
              [ -n "$path" ] || continue
              case "$path" in
                crates/*|crossval/*|tests/*|tools/bitnet-task/*|xtask/*|fuzz/*|Cargo.toml|Cargo.lock|rust-toolchain.toml|Makefile)
                  no_rust_inputs=false
                  ;;
              esac

              case "$path" in
                docs/tracking/*|.codex/campaigns/*)
                  ;;
                *)
                  tracker_only=false
                  ;;
              esac

              case "$path" in
                docs/tracking/*|.codex/campaigns/*)
                  ;;
                *)
                  tracker_or_campaign_only=false
                  ;;
              esac

              case "$path" in
                docs/tracking/*|.codex/campaigns/*)
                  docs_only=false
                  ;;
                docs/*|*.md|README*|CHANGELOG*|CONTRIBUTING*|SECURITY*|COMPATIBILITY*|THIRD_PARTY*)
                  ;;
                *)
                  docs_only=false
                  ;;
              esac

              case "$path" in
                ci/hardware/*)
                  ;;
                *)
                  hardware_receipt_only=false
                  ;;
              esac

              case "$path" in
                docs/ci/*|policy/*|codecov.yml)
                  ;;
                *)
                  policy_docs_only=false
                  ;;
              esac
            done <<< "$changed_files"

            if [ -z "$changed_files" ]; then
              tracker_only=false
              no_rust_inputs=false
              docs_only=false
              tracker_or_campaign_only=false
              hardware_receipt_only=false
              policy_docs_only=false
            fi

            if [ "${tracker_or_campaign_only}" = "true" ] || [ "${hardware_receipt_only}" = "true" ]; then
              fast_path_checks_required=true
            fi
          fi

          echo "tracker_only=${tracker_only}" >> "$GITHUB_OUTPUT"
          echo "no_rust_inputs=${no_rust_inputs}" >> "$GITHUB_OUTPUT"
          echo "docs_only=${docs_only}" >> "$GITHUB_OUTPUT"
          echo "tracker_or_campaign_only=${tracker_or_campaign_only}" >> "$GITHUB_OUTPUT"
          echo "hardware_receipt_only=${hardware_receipt_only}" >> "$GITHUB_OUTPUT"
          echo "policy_docs_only=${policy_docs_only}" >> "$GITHUB_OUTPUT"
          echo "fast_path_checks_required=${fast_path_checks_required}" >> "$GITHUB_OUTPUT"
          {
            echo "changed_files<<EOF"
            printf '%s\n' "$changed_files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "tracker_only=${tracker_only}"
            echo "no_rust_inputs=${no_rust_inputs}"
            echo "docs_only=${docs_only}"
            echo "tracker_or_campaign_only=${tracker_or_campaign_only}"
            echo "hardware_receipt_only=${hardware_receipt_only}"
            echo "policy_docs_only=${policy_docs_only}"
            echo "fast_path_checks_required=${fast_path_checks_required}"
          }

  tracker-fast-path:
    name: No-Rust Fast Path
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: [classify-changes]
    if: needs.classify-changes.outputs.fast_path_checks_required == 'true'
    steps:
      - name: Tracker/campaign delegated checks
        if: needs.classify-changes.outputs.tracker_or_campaign_only == 'true'
        run: |
          echo "Tracker/campaign-only change: CI Core is using the no-Rust fast path."
          echo "Campaign doctor and generated dashboard freshness run in the Campaign Tracker workflow."

      - name: Checkout code
        if: needs.classify-changes.outputs.hardware_receipt_only == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Hardware receipt JSON syntax
        if: needs.classify-changes.outputs.hardware_receipt_only == 'true'
        env:
          CHANGED_FILES: ${{ needs.classify-changes.outputs.changed_files }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import sys

          changed = [
              line.strip()
              for line in os.environ.get("CHANGED_FILES", "").splitlines()
              if line.strip()
          ]
          receipts = [
              pathlib.Path(path)
              for path in changed
              if path.startswith("ci/hardware/") and path.endswith(".json")
          ]
          failures = []
          for receipt in receipts:
              try:
                  json.loads(receipt.read_text(encoding="utf-8"))
              except Exception as exc:
                  failures.append(f"{receipt}: {exc}")

          if failures:
              print("Invalid hardware receipt JSON:")
              print("\n".join(failures))
              sys.exit(1)
          print(f"Validated {len(receipts)} changed hardware receipt JSON file(s).")
          PY

  # Job 1: Build and test on Linux
  # Note: Job name kept as 'ubuntu-latest' for branch protection rule compatibility,
  # but runner is pinned to ubuntu-22.04 for CI reproducibility.
  build-test-linux:
    name: Build & Test (ubuntu-latest)
    runs-on: ubuntu-22.04
    # Keep this above the normal completion time for the expanded core test
    # lane. CI timeouts are guardrails against wedged jobs, not targets that
    # should routinely cancel useful proof near completion.
    timeout-minutes: 40
    needs: [classify-changes]
    env:
      RUSTFLAGS: "-D warnings"
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      INSTA_UPDATE: unseen
    steps:
      - name: No-Rust fast path
        if: needs.classify-changes.outputs.no_rust_inputs == 'true'
        run: |
          echo "No Rust inputs changed: skipping Rust build and test steps."

      - name: Checkout code
        if: needs.classify-changes.outputs.no_rust_inputs != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Rust toolchain
        if: needs.classify-changes.outputs.no_rust_inputs != 'true'
        uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6  # stable
        with:
          toolchain: "1.95.0"
          components: clippy,rustfmt

      - name: Cache Rust dependencies
        if: needs.classify-changes.outputs.no_rust_inputs != 'true'
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0  # v2
        with:
          shared-key: ci-core-ubuntu
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Plan package selection
        id: package-plan
        if: needs.classify-changes.outputs.no_rust_inputs != 'true'
        env:
          CHANGED_FILES: ${{ needs.classify-changes.outputs.changed_files }}
          EVENT_NAME: ${{ github.event_name }}
          LABELS_JSON: ${{ github.event_name == 'pull_request' && toJson(github.event.pull_request.labels.*.name) || '[]' }}
        run: |
          set -euo pipefail
          mkdir -p target/ci
          printf '%s\n' "$CHANGED_FILES" > target/ci/changed-files.txt
          cargo run --locked -p xtask --no-default-features -- ci plan \
            --changed-file target/ci/changed-files.txt \
            --labels-json "$LABELS_JSON" \
            --json-out target/ci/ci-plan.json \
            --print

          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path

          plan = json.loads(Path("target/ci/ci-plan.json").read_text(encoding="utf-8"))
          packages = plan.get("packages", {})
          selected = list(dict.fromkeys(packages.get("selected", [])))

          cpu_feature_packages = {
              "bitnet",
              "bitnet-common",
              "bitnet-models",
              "bitnet-tokenizers",
              "bitnet-quantization",
              "bitnet-kernels",
              "bitnet-inference",
              "bitnet-bdd-grid-core",
              "bitnet-bdd-grid",
              "bitnet-feature-contract",
              "bitnet-testing-policy-core",
              "bitnet-testing-scenarios-core",
              "bitnet-runtime-feature-flags-core",
              "bitnet-runtime-feature-flags",
              "bitnet-startup-contract-core",
              "bitnet-startup-contract-diagnostics",
              "bitnet-startup-contract-guard",
              "bitnet-runtime-context-core",
              "bitnet-testing-scenarios-profile-core",
              "bitnet-runtime-profile-contract-core",
              "bitnet-testing-policy-runtime",
              "bitnet-testing-policy-tests",
              "bitnet-testing-policy-kit",
              "bitnet-testing-profile",
              "bitnet-testing-policy-contract",
              "bitnet-testing-policy-interop",
          }
          default_feature_packages = {
              "bitnet-prompt-templates",
              "bitnet-receipts",
              "bitnet-sampling",
          }
          no_feature_packages = {
              "bitnet-logits",
              "bitnet-gguf",
              "bitnet-generation",
              "bitnet-device-probe",
              "bitnet-engine-core",
          }
          supported = cpu_feature_packages | default_feature_packages | no_feature_packages
          unsupported = [package for package in selected if package not in supported]
          broad = bool(packages.get("broad_sweep_required")) or bool(unsupported) or not selected
          if os.environ.get("EVENT_NAME") != "pull_request" and not selected:
              broad = True

          def args(names):
              return " ".join(f"-p {name}" for name in names)

          print(f"broad_sweep_required={str(broad).lower()}")
          print(f"selection_reason={packages.get('selection_reason', '')}")
          print(f"selected_packages_csv={','.join(selected)}")
          print(f"unsupported_packages_csv={','.join(unsupported)}")
          print(f"cpu_package_args={args([p for p in selected if p in cpu_feature_packages])}")
          print(f"default_package_args={args([p for p in selected if p in default_feature_packages])}")
          print(f"no_feature_package_args={args([p for p in selected if p in no_feature_packages])}")
          print(f"run_inference_golden={str(broad or 'bitnet-inference' in selected).lower()}")
          print(f"run_avx2_quantization={str(broad or 'bitnet-quantization' in selected).lower()}")
          print(f"run_avx2_kernels={str(broad or 'bitnet-kernels' in selected).lower()}")
          PY

          echo "Package selection:"
          echo "  broad: $(grep '^broad_sweep_required=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2-)"
          echo "  selected: $(grep '^selected_packages_csv=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2-)"
          echo "  unsupported: $(grep '^unsupported_packages_csv=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2-)"

      - name: Check formatting
        if: needs.classify-changes.outputs.no_rust_inputs != 'true'
        run: cargo fmt --all -- --check

      - name: Build core libs (CPU features)
        if: needs.classify-changes.outputs.no_rust_inputs != 'true' && steps.package-plan.outputs.broad_sweep_required == 'true'
        run: |
          cargo build --locked \
            -p bitnet-common \
            -p bitnet-models \
            -p bitnet-tokenizers \
            -p bitnet-quantization \
            -p bitnet-kernels \
            --no-default-features --features cpu

      - name: Build SRP microcrates
        if: needs.classify-changes.outputs.no_rust_inputs != 'true' && steps.package-plan.outputs.broad_sweep_required == 'true'
        run: |
          cargo build --locked \
            -p bitnet-prompt-templates \
            -p bitnet-receipts \
            -p bitnet-sampling

      - name: Build selected packages
        if: needs.classify-changes.outputs.no_rust_inputs != 'true' && steps.package-plan.outputs.broad_sweep_required != 'true'
        env:
          CPU_PACKAGE_ARGS: ${{ steps.package-plan.outputs.cpu_package_args }}
          DEFAULT_PACKAGE_ARGS: ${{ steps.package-plan.outputs.default_package_args }}
          NO_FEATURE_PACKAGE_ARGS: ${{ steps.package-plan.outputs.no_feature_package_args }}
        run: |
          set -euo pipefail
          ran=false
          if [ -n "$CPU_PACKAGE_ARGS" ]; then
            cargo build --locked $CPU_PACKAGE_ARGS --no-default-features --features cpu
            ran=true
          fi
          if [ -n "$DEFAULT_PACKAGE_ARGS" ]; then
            cargo build --locked $DEFAULT_PACKAGE_ARGS
            ran=true
          fi
          if [ -n "$NO_FEATURE_PACKAGE_ARGS" ]; then
            cargo build --locked $NO_FEATURE_PACKAGE_ARGS --no-default-features
            ran=true
          fi
          if [ "$ran" != "true" ]; then
            echo "No selected packages to build."
          fi

      - name: "Run unit tests: core libs"
        if: needs.classify-changes.outputs.no_rust_inputs != 'true' && steps.package-plan.outputs.broad_sweep_required == 'true'
        run: |
          cargo test --locked \
            -p bitnet-common \
            -p bitnet-models \
            -p bitnet-tokenizers \
            -p bitnet-quantization \
            -p bitnet-kernels \
            --lib \
            --no-default-features --features cpu \
            -- --nocapture

      - name: "Run unit tests: SRP microcrates"
        if: needs.classify-changes.outputs.no_rust_inputs != 'true' && steps.package-plan.outputs.broad_sweep_required == 'true'
        run: |
          cargo test --locked \
            -p bitnet-prompt-templates \
            -p bitnet-receipts \
            -p bitnet-sampling
          cargo test --locked \
            -p bitnet-logits \
            -p bitnet-gguf \
            -p bitnet-generation \
            -p bitnet-device-probe \
            -p bitnet-engine-core \
            --no-default-features

      - name: "Run tests: inference golden path"
        if: needs.classify-changes.outputs.no_rust_inputs != 'true' && steps.package-plan.outputs.broad_sweep_required == 'true'
        run: |
          cargo test --locked \
            -p bitnet-inference --test cpu_golden_path \
            --no-default-features --features cpu

      - name: "Run unit tests: policy / BDD crates"
        if: needs.classify-changes.outputs.no_rust_inputs != 'true' && steps.package-plan.outputs.broad_sweep_required == 'true'
        run: |
          cargo test --locked \
            -p bitnet-bdd-grid-core \
            -p bitnet-bdd-grid \
            -p bitnet-feature-contract \
            -p bitnet-testing-policy-core \
            -p bitnet-testing-scenarios-core \
            -p bitnet-runtime-feature-flags-core \
            -p bitnet-runtime-feature-flags \
            -p bitnet-startup-contract-core \
            -p bitnet-startup-contract-diagnostics \
            -p bitnet-startup-contract-guard \
            -p bitnet-runtime-context-core \
            -p bitnet-testing-scenarios-profile-core \
            -p bitnet-runtime-profile-contract-core \
            -p bitnet-testing-policy-runtime \
            -p bitnet-testing-policy-tests \
            -p bitnet-testing-policy-kit \
            -p bitnet-testing-profile \
            -p bitnet-testing-policy-contract \
            -p bitnet-testing-policy-interop \
            --no-default-features --features cpu

      - name: "Run unit tests: selected packages"
        if: needs.classify-changes.outputs.no_rust_inputs != 'true' && steps.package-plan.outputs.broad_sweep_required != 'true'
        env:
          CPU_PACKAGE_ARGS: ${{ steps.package-plan.outputs.cpu_package_args }}
          DEFAULT_PACKAGE_ARGS: ${{ steps.package-plan.outputs.default_package_args }}
          NO_FEATURE_PACKAGE_ARGS: ${{ steps.package-plan.outputs.no_feature_package_args }}
        run: |
          set -euo pipefail
          ran=false
          if [ -n "$CPU_PACKAGE_ARGS" ]; then
            cargo test --locked $CPU_PACKAGE_ARGS --lib --no-default-features --features cpu -- --nocapture
            ran=true
          fi
          if [ -n "$DEFAULT_PACKAGE_ARGS" ]; then
            cargo test --locked $DEFAULT_PACKAGE_ARGS
            ran=true
          fi
          if [ -n "$NO_FEATURE_PACKAGE_ARGS" ]; then
            cargo test --locked $NO_FEATURE_PACKAGE_ARGS --no-default-features
            ran=true
          fi
          if [ "$ran" != "true" ]; then
            echo "No selected packages to test."
          fi

      - name: "Run tests: selected inference golden path"
        if: needs.classify-changes.outputs.no_rust_inputs != 'true' && steps.package-plan.outputs.broad_sweep_required != 'true' && steps.package-plan.outputs.run_inference_golden == 'true'
        run: |
          cargo test --locked \
            -p bitnet-inference --test cpu_golden_path \
            --no-default-features --features cpu

      - name: "Run unit tests: AVX2 quantization (x86_64 static +avx2)"
        if: needs.classify-changes.outputs.no_rust_inputs != 'true' && runner.os == 'Linux' && runner.arch == 'X64' && steps.package-plan.outputs.run_avx2_quantization == 'true'
        env:
          RUSTFLAGS: "-D warnings -C target-feature=+avx2"
        run: |
          cargo test --locked \
            -p bitnet-quantization \
            --lib \
            --no-default-features --features cpu \
            -- --nocapture

      - name: "Run unit tests: AVX2 kernels (x86_64 static +avx2)"
        if: needs.classify-changes.outputs.no_rust_inputs != 'true' && runner.os == 'Linux' && runner.arch == 'X64' && steps.package-plan.outputs.run_avx2_kernels == 'true'
        env:
          RUSTFLAGS: "-D warnings -C target-feature=+avx2"
        run: |
          cargo test --locked \
            -p bitnet-kernels \
            --lib \
            --no-default-features --features cpu,avx2 \
            -- --nocapture

  # Job 2: BDD Grid Check (separate job for parallel execution and clear gate signal)
  # The xtask grid-check validates BDD/policy/runtime-flag coverage. Most PRs
  # do not touch those crates, so the work is wasted on the default path.
  # Gate to main / dispatch / `bdd` / `grid` / `full-ci` label. The
  # build-test-linux job still runs the policy / BDD crate unit tests on every
  # PR, so functional regressions to those crates are caught regardless.
  grid-check:
    name: BDD Grid Check
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    needs: [classify-changes]
    if: >-
      needs.classify-changes.outputs.no_rust_inputs != 'true' &&
      (github.ref == 'refs/heads/main' ||
       github.event_name == 'workflow_dispatch' ||
       contains(github.event.pull_request.labels.*.name, 'bdd') ||
       contains(github.event.pull_request.labels.*.name, 'grid') ||
       contains(github.event.pull_request.labels.*.name, 'full-ci'))
    env:
      RUSTFLAGS: "-D warnings"
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6  # stable
        with:
          toolchain: "1.95.0"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0  # v2
        with:
          shared-key: ci-core-grid-check
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run BDD Grid Check (CPU cells)
        run: cargo run --locked --no-default-features -p xtask -- grid-check --cpu-only --verbose

  # Job 4: Clippy linting
  clippy:
    name: Clippy
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    needs: [classify-changes]
    env:
      RUSTFLAGS: "-D warnings"
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - name: No-Rust fast path
        if: needs.classify-changes.outputs.no_rust_inputs == 'true'
        run: |
          echo "No Rust inputs changed: skipping clippy."

      - name: Checkout code
        if: needs.classify-changes.outputs.no_rust_inputs != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Rust toolchain
        if: needs.classify-changes.outputs.no_rust_inputs != 'true'
        uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6  # stable
        with:
          toolchain: "1.95.0"
          components: clippy

      - name: Cache Rust dependencies
        if: needs.classify-changes.outputs.no_rust_inputs != 'true'
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0  # v2
        with:
          shared-key: ci-core-clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run clippy (core crates, libs only)
        if: needs.classify-changes.outputs.no_rust_inputs != 'true'
        run: |
          cargo clippy --locked \
            -p bitnet-common \
            -p bitnet-models \
            -p bitnet-tokenizers \
            -p bitnet-quantization \
            -p bitnet-kernels \
            --lib \
            --no-default-features --features cpu
          # SRP microcrates
          cargo clippy --locked \
            -p bitnet-prompt-templates \
            -p bitnet-receipts \
            -p bitnet-sampling

  # Job 5: Clippy linting (macOS ARM64 / Apple Silicon)
  # macOS minutes are 10x Linux. Even with continue-on-error and
  # exclusion from the required summary, this job pays setup + cargo
  # clippy on every default PR for a non-blocking signal. Move it to
  # main / dispatch / explicit `macos` or `full-ci` label, where the
  # platform delta is actually worth measuring.
  clippy-macos-arm64:
    name: Clippy (macOS ARM64)
    runs-on: macos-14
    continue-on-error: true
    timeout-minutes: 15
    if: >-
      github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'macos') ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    env:
      # Allow NEON-idiomatic patterns common in SIMD intrinsic code (~120 files).
      # Linux x86 Clippy remains strict (-D warnings with no allows).
      RUSTFLAGS: >-
        -D warnings
        -A clippy::missing_safety_doc
        -A clippy::needless_range_loop
        -A clippy::manual_is_multiple_of
        -A clippy::manual_div_ceil
        -A clippy::unnecessary_cast
        -A clippy::ptr_as_ptr
        -A clippy::excessive_precision
        -A clippy::manual_range_contains
        -A clippy::collapsible_if
        -A clippy::let_and_return
        -A clippy::new_without_default
        -A clippy::assign_op_pattern
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6  # stable
        with:
          toolchain: "1.95.0"
          components: clippy

      - name: Prefer installed Rust toolchain binaries
        run: echo "$HOME/.rustup/toolchains/1.95.0-aarch64-apple-darwin/bin" >> "$GITHUB_PATH"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0  # v2
        with:
          shared-key: ci-core-clippy-macos-arm64
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run clippy (core crates, libs only)
        run: |
          cargo clippy --locked \
            -p bitnet-common \
            -p bitnet-models \
            -p bitnet-tokenizers \
            -p bitnet-quantization \
            -p bitnet-kernels \
            --lib \
            --no-default-features --features cpu

  # Job 6: Documentation build
  docs:
    name: Documentation
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    needs: [classify-changes]
    steps:
      - name: No-Rust fast path
        if: needs.classify-changes.outputs.no_rust_inputs == 'true'
        run: |
          echo "No Rust inputs changed: skipping rustdoc."

      - name: Checkout code
        if: needs.classify-changes.outputs.no_rust_inputs != 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Rust toolchain
        if: needs.classify-changes.outputs.no_rust_inputs != 'true'
        uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6  # stable
        with:
          toolchain: "1.95.0"

      - name: Cache Rust dependencies
        if: needs.classify-changes.outputs.no_rust_inputs != 'true'
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0  # v2
        with:
          shared-key: ci-core-docs
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build documentation
        if: needs.classify-changes.outputs.no_rust_inputs != 'true'
        env:
          RUSTDOCFLAGS: -A warnings
        run: cargo doc --locked --no-deps --workspace --no-default-features --features cpu

  # Summary job (required for branch protection)
  ci-core-success:
    name: CI Core Success
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    needs: [classify-changes, tracker-fast-path, build-test-linux, grid-check, clippy, docs]
    if: always()
    steps:
      - name: Summarize core results
        if: always()
        run: |
          echo "Core results:"
          echo "  No Rust inputs: ${{ needs.classify-changes.outputs.no_rust_inputs }}"
          echo "  Docs only: ${{ needs.classify-changes.outputs.docs_only }}"
          echo "  Tracker/campaign only: ${{ needs.classify-changes.outputs.tracker_or_campaign_only }}"
          echo "  Hardware receipt only: ${{ needs.classify-changes.outputs.hardware_receipt_only }}"
          echo "  Policy docs only: ${{ needs.classify-changes.outputs.policy_docs_only }}"
          echo "  No-Rust Fast Path: ${{ needs.tracker-fast-path.result }}"
          echo "  Build & Test: ${{ needs.build-test-linux.result }}"
          echo "  Grid Check:   ${{ needs.grid-check.result }}"
          echo "  Clippy:       ${{ needs.clippy.result }}"
          echo "  Docs:         ${{ needs.docs.result }}"

      - name: Check all jobs succeeded
        if: always()
        run: |
          bad=0
          if [ "${{ needs.classify-changes.result }}" != "success" ]; then
            bad=1
          fi
          if [ "${{ needs.classify-changes.outputs.no_rust_inputs }}" = "true" ]; then
            if [ "${{ needs.classify-changes.outputs.fast_path_checks_required }}" = "true" ]; then
              [ "${{ needs.tracker-fast-path.result }}" = "success" ] || bad=1
            else
              [ "${{ needs.tracker-fast-path.result }}" = "skipped" ] || bad=1
            fi
            for r in "${{ needs.build-test-linux.result }}" \
                     "${{ needs.clippy.result }}" \
                     "${{ needs.docs.result }}"; do
              [ "$r" = "success" ] || bad=1
            done
          else
            # Required jobs (must succeed)
            for r in "${{ needs.build-test-linux.result }}" \
                     "${{ needs.clippy.result }}" \
                     "${{ needs.docs.result }}"; do
              [ "$r" = "success" ] || bad=1
            done
            [ "${{ needs.tracker-fast-path.result }}" = "skipped" ] || bad=1
          fi
          # grid-check is conditionally skipped on PRs that do not touch
          # BDD / policy crates (gated by label / main / dispatch). Treat
          # skipped as acceptable, but do not allow failures or cancellations.
          case "${{ needs.grid-check.result }}" in
            success|skipped) ;;
            *) bad=1 ;;
          esac
          if [ $bad -ne 0 ]; then
            echo "❌ One or more core CI jobs failed (or were cancelled)"; exit 1
          fi
          echo "✅ Core CI jobs succeeded"
