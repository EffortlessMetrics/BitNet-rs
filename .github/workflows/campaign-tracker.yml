name: Campaign Tracker

on:
  pull_request:
    paths:
      - '.codex/campaigns/**'
      - 'docs/tracking/**'
      - 'xtask/src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/campaign-tracker.yml'
  push:
    branches: [main]
    paths:
      - '.codex/campaigns/**'
      - 'docs/tracking/**'
      - 'xtask/src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/campaign-tracker.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  campaign-tracker:
    name: Doctor + Generated Dashboards
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6  # stable
        with:
          toolchain: "1.93.0"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0  # v2
        with:
          shared-key: campaign-tracker

      - name: Campaign doctor
        run: cargo run --locked -p xtask --no-default-features -- campaign doctor

      - name: Generated dashboard freshness
        run: cargo run --locked -p xtask --no-default-features -- campaign generate --check
