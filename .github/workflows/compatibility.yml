name: Compatibility Tests

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'crossval/**'
      - 'xtask/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/compatibility.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  route-msrv:
    name: Route MSRV Compatibility
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      selected: ${{ steps.route.outputs.selected }}
      reason: ${{ steps.route.outputs.reason }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - name: Decide whether MSRV is selected
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref || github.ref_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail

          selected=false
          reason="ordinary PR without MSRV label or compatibility-risk paths"

          if [ "$EVENT_NAME" != "pull_request" ]; then
            selected=true
            reason="$EVENT_NAME"
          elif python - "$LABELS_JSON" <<'PY'
          import json
          import sys

          labels = set(json.loads(sys.argv[1] or "[]"))
          selected = bool(labels & {"msrv", "compatibility", "full-ci"})
          sys.exit(0 if selected else 1)
          PY
          then
            selected=true
            reason="explicit msrv/compatibility/full-ci label"
          else
            if [ -n "${BASE_SHA:-}" ] && changed="$(git diff --name-only "$BASE_SHA"...HEAD 2>/dev/null)"; then
              :
            elif changed="$(git diff --name-only "origin/$BASE_REF"...HEAD 2>/dev/null)"; then
              :
            else
              git fetch --no-tags --depth=50 origin "$BASE_REF" >/dev/null 2>&1 || true
              changed="$(git diff --name-only "origin/$BASE_REF"...HEAD 2>/dev/null || git diff --name-only HEAD~1..HEAD 2>/dev/null || true)"
            fi
            if printf '%s\n' "$changed" | grep -E '^(Cargo\.toml|Cargo\.lock|rust-toolchain\.toml|\.cargo/|crates/[^/]+/Cargo\.toml|crates/[^/]+/src/lib\.rs|crates/[^/]+/src/api/|crates/bitnet-ffi/|crates/bitnet-py/|COMPATIBILITY\.md|MIGRATION\.md|docs/release/|\.github/workflows/compatibility\.yml|policy/ci-risk-packs\.toml)' >/dev/null; then
              selected=true
              reason="manifest/toolchain/public API/release compatibility paths changed"
            fi
          fi

          echo "selected=$selected" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          {
            echo "### MSRV route"
            echo "- selected: $selected"
            echo "- reason: $reason"
          } >> "$GITHUB_STEP_SUMMARY"

  msrv:
    name: Minimum Supported Rust Version
    needs: route-msrv
    if: needs.route-msrv.outputs.selected == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - id: msrv
        name: Read MSRV from rust-toolchain.toml
        shell: bash
        run: |
          # Robust grep (works on minimal runners)
          MSRV=$(grep -Eo 'channel\s*=\s*"[0-9.]+"' rust-toolchain.toml | sed -E 's/.*"([0-9.]+)".*/\1/')
          if [ -z "$MSRV" ]; then
            echo "Could not parse channel from rust-toolchain.toml"; exit 1
          fi
          echo "msrv=$MSRV" >> "$GITHUB_OUTPUT"
          echo "cache_key=msrv-${MSRV//./_}" >> "$GITHUB_OUTPUT"

      - name: Install Rust (${{ steps.msrv.outputs.msrv }})
        uses: dtolnay/rust-toolchain@6d653acede28d24f02e3cd41383119e8b1b35921  # master
        with:
          toolchain: ${{ steps.msrv.outputs.msrv }}

      - name: Cache (MSRV)
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0  # v2
        with:
          shared-key: ${{ steps.msrv.outputs.cache_key }}

      - name: Warm fetch (locked)
        run: cargo fetch --locked

      - name: Report toolchain versions
        run: |
          cargo --version && rustc --version

      - name: "MSRV check: core libs"
        run: |
          cargo check --locked \
            -p bitnet-common \
            -p bitnet-models \
            -p bitnet-tokenizers \
            -p bitnet-quantization \
            -p bitnet-kernels \
            --tests \
            --no-default-features --features cpu

      - name: "MSRV check: SRP microcrates"
        run: |
          cargo check --locked \
            -p bitnet-prompt-templates \
            -p bitnet-receipts \
            -p bitnet-sampling \
            -p bitnet-logits \
            -p bitnet-gguf \
            -p bitnet-generation \
            -p bitnet-device-probe \
            -p bitnet-engine-core \
            --tests \
            --no-default-features

      - name: "MSRV check: inference golden path"
        run: |
          cargo check --locked \
            -p bitnet-inference \
            --test cpu_golden_path \
            --no-default-features --features cpu

      - name: "MSRV check: policy / BDD crates"
        run: |
          cargo check --locked \
            -p bitnet-bdd-grid-core \
            -p bitnet-bdd-grid \
            -p bitnet-feature-contract \
            -p bitnet-testing-policy-core \
            -p bitnet-testing-scenarios-core \
            -p bitnet-runtime-feature-flags-core \
            -p bitnet-runtime-feature-flags \
            -p bitnet-startup-contract-core \
            -p bitnet-startup-contract-diagnostics \
            -p bitnet-startup-contract-guard \
            -p bitnet-runtime-context-core \
            -p bitnet-testing-scenarios-profile-core \
            -p bitnet-runtime-profile-contract-core \
            -p bitnet-testing-policy-runtime \
            -p bitnet-testing-policy-tests \
            -p bitnet-testing-policy-kit \
            -p bitnet-testing-profile \
            -p bitnet-testing-policy-contract \
            -p bitnet-testing-policy-interop \
            --tests \
            --no-default-features --features cpu

  msrv-workspace-informational:
    name: MSRV Workspace Coverage (informational)
    needs: route-msrv
    if: needs.route-msrv.outputs.selected == 'true'
    runs-on: ubuntu-22.04
    continue-on-error: true
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - id: msrv
        name: Read MSRV from rust-toolchain.toml
        shell: bash
        run: |
          MSRV=$(grep -Eo 'channel\s*=\s*"[0-9.]+"' rust-toolchain.toml | sed -E 's/.*"([0-9.]+)".*/\1/')
          if [ -z "$MSRV" ]; then
            echo "Could not parse channel from rust-toolchain.toml"; exit 1
          fi
          echo "msrv=$MSRV" >> "$GITHUB_OUTPUT"
          echo "cache_key=msrv-${MSRV//./_}-workspace" >> "$GITHUB_OUTPUT"

      - name: Install Rust (${{ steps.msrv.outputs.msrv }})
        uses: dtolnay/rust-toolchain@6d653acede28d24f02e3cd41383119e8b1b35921  # master
        with:
          toolchain: ${{ steps.msrv.outputs.msrv }}

      - name: Cache (MSRV workspace)
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0  # v2
        with:
          shared-key: ${{ steps.msrv.outputs.cache_key }}

      - name: Warm fetch (locked)
        run: cargo fetch --locked

      - name: Report toolchain versions
        run: |
          cargo --version && rustc --version

      - name: MSRV check (workspace, no codegen)
        run: cargo check --workspace --all-targets --locked --no-default-features --features cpu

  abi-stability:
    name: ABI Stability Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # ABI surface only changes when bitnet-ffi / public C headers move.
    # Gate to main, manual dispatch, or PRs that opt in via the `ffi` or
    # `full-ci` label. This avoids building libbitnet_ffi on every PR.
    if: >-
      github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'ffi') ||
      contains(github.event.pull_request.labels.*.name, 'abi') ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6  # stable
        with:
          toolchain: "1.95.0"
      - name: Build FFI library
        run: |
          cargo build -p bitnet-ffi --locked --release --no-default-features --features cpu
      - name: Extract symbols (Linux)
        run: |
          nm -D target/release/libbitnet_ffi.so | awk '{print $3}' | grep -E '^(bitnet_|llama_)' | sort > symbols.txt
          diff -u ci/expected-symbols-linux.txt symbols.txt || echo "Symbol diff found (may be expected during development)"

  ffi-smoke-test:
    name: FFI Smoke Test
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    # Builds libbitnet_ffi.so and a C harness; only useful when FFI surface
    # could plausibly have moved. Gate to main, manual dispatch, or label.
    if: >-
      github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'ffi') ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6  # stable
        with:
          toolchain: "1.95.0"
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake clang pkg-config || true
      - name: Build FFI library
        run: |
          cargo build -p bitnet-ffi --locked --release --no-default-features --features cpu || true
      - name: Export LD_LIBRARY_PATH
        run: echo "LD_LIBRARY_PATH=$PWD/target/release:$LD_LIBRARY_PATH" >> $GITHUB_ENV || true
      - name: Compile C test
        run: |
          cd crates/bitnet-ffi/tests
          gcc -o test_ffi c_integration_test.c \
            -L../../../target/release -lbitnet_ffi \
            -I../include || true
      - name: Run C test
        run: |
          cd crates/bitnet-ffi/tests
          LD_LIBRARY_PATH=../../../target/release ./test_ffi || true

  validation-pr:
    name: Model Validation (PR Lane)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Currently a no-op when no test model is committed; only run when a real
    # model fixture exists (signaled via the `model-validation` or `full-ci` label),
    # on main, or on manual dispatch. Avoids wasting minutes on an unconditional
    # successful exit on every PR.
    if: >-
      github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'model-validation') ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6  # stable
        with:
          toolchain: "1.95.0"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq bc
          pip install transformers torch scipy
      - name: Build BitNet CLI
        run: |
          cargo build -p bitnet-cli --locked --release --no-default-features --features cpu
      - name: Download test model
        run: |
          # Download small test model for CI (you'll need to set this up)
          echo "Model download would go here"
          # For now, skip if no model available
          if [ ! -f "models/test/model.gguf" ]; then
            echo "No test model available, skipping validation"
            exit 0
          fi
      - name: Run validation suite
        run: |
          if [ -f "models/test/model.gguf" ]; then
            MODEL_PATH=models/test/model.gguf \
            TOKENIZER=models/test/tokenizer.json \
            HF_MODEL_ID=test/model \
            PROP_EXAMPLES=5 \
            TAU_STEPS=10 \
            TAU_MIN=0.60 \
            DELTA_NLL_MAX=1e-2 \
            scripts/validate_all.sh
          fi
      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: validation-artifacts
          path: artifacts/

  tokenizer-fixtures:
    name: Tokenizer Compatibility Tests
    runs-on: ubuntu-latest
    continue-on-error: true  # Informational while stabilizing baselines
    timeout-minutes: 10
    # Installs transformers + torch + scipy and replays tokenizer fixtures.
    # Only relevant when bitnet-tokenizers or its fixtures change. Gate to
    # main, manual dispatch, or PRs that opt in via the `tokenizer` /
    # `full-ci` label.
    if: >-
      github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'tokenizer') ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6  # stable
        with:
          toolchain: "1.95.0"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.10'
      - name: Install Python dependencies
        run: |
          python -m pip install -U pip setuptools wheel
          pip install "transformers==4.44.2" "tokenizers==0.19.1" "torch==2.*" "scipy==1.*"
      - name: Configure offline mode
        run: |
          echo "TOKENIZERS_PARALLELISM=false" >> $GITHUB_ENV
          echo "HF_HUB_DISABLE_TELEMETRY=1" >> $GITHUB_ENV
          echo "TRANSFORMERS_OFFLINE=1" >> $GITHUB_ENV
      - name: Ensure tokenizer fixtures
        run: |
          cd crates/bitnet-tokenizers
          mkdir -p fixtures
          cp -r ../../tests/fixtures/tokenizers/* fixtures/ || true
      - name: Test tokenizer fixtures
        run: |
          cd crates/bitnet-tokenizers
          cargo test --locked --features fixtures -- --nocapture || true
      - name: Verify GPT-2 compatibility
        run: |
          cargo run --locked --example tokenizer_compat_test -- \
            --model gpt2 \
            --input "Hello, world!" \
            --expected fixtures/gpt2-hello-world.json || true
      - name: Verify Llama compatibility
        run: |
          cargo run --locked --example tokenizer_compat_test -- \
            --model llama \
            --input "Hello, world!" \
            --expected fixtures/llama-hello-world.json || true
      - name: Tokenizer parity smoke test
        if: github.event_name == 'pull_request'
        run: |
          # Build BitNet CLI
          cargo build -p bitnet-cli --locked --release --no-default-features --features cpu || true

          # Run smoke test if model and tokenizer available
          if [ -f "models/test-model.gguf" ] && [ -f "models/tokenizer.json" ]; then
            BITNET_BIN=target/release/bitnet \
            MODEL_PATH=models/test-model.gguf \
            TOKENIZER=models/tokenizer.json \
            HF_MODEL_ID=gpt2 \
            scripts/test-tokenizer-parity.py --smoke || true
          else
            echo "Skipping tokenizer parity test - model not available"
          fi

  gguf-compat:
    name: GGUF Compatibility Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Downloads a multi-GB GGUF on cache miss; not worth running on every PR.
    # Run on main, manual dispatch, or when explicitly requested via labels.
    if: >-
      github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'gguf') ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6  # stable
        with:
          toolchain: "1.95.0"
      - name: Cache test GGUF
        id: cache-gguf
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: test-model.gguf
          key: test-gguf-llama2-q2k-v1
      - name: Download test GGUF
        if: steps.cache-gguf.outputs.cache-hit != 'true'
        run: |
          # Use smaller test model to avoid rate limits - could also use a tiny test GGUF
          wget -q https://huggingface.co/TheBloke/Llama-2-7B-GGUF/resolve/main/llama-2-7b.Q2_K.gguf \
            -O test-model.gguf || \
          echo "Failed to download, using placeholder" && \
          echo "GGUF" > test-model.gguf
      - name: Check GGUF compatibility
        run: |
          cargo run --locked -p bitnet-cli --no-default-features --features cpu -- compat-check test-model.gguf > compat-report.txt || echo "Compatibility check completed"
          grep -q "compatibility issues" compat-report.txt || echo "Model is compatible"
      - name: Test GGUF export
        run: |
          cargo run --locked -p bitnet-cli --no-default-features --features cpu -- compat-fix test-model.gguf fixed-model.gguf || echo "Export completed"
          test -f fixed-model.gguf.compat.json || echo "Compat JSON not generated (expected for some models)"

  cross-val-determinism:
    name: Cross-Validation Determinism
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: contains(github.event.pull_request.labels.*.name, 'crossval')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6  # stable
        with:
          toolchain: "1.95.0"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.10'
      - name: Install Python dependencies
        run: |
          pip install hypothesis transformers torch
      - name: Download test model
        run: cargo xtask download-model
      - name: Build C++ implementation
        run: cargo xtask fetch-cpp
      - name: Run deterministic cross-validation
        env:
          BITNET_GGUF: models/microsoft-bitnet-b1.58-2B-4T-gguf/ggml-model-i2_s.gguf
          BITNET_DETERMINISTIC: 1
          BITNET_SEED: 42
          PARITY_ARTIFACT: artifacts/parity_failures.jsonl
        run: |
          cargo test --locked --package crossval --features deterministic -- \
            --test eval_ids_parity \
            --nocapture
      - name: Upload parity artifacts on failure
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: parity-artifacts
          path: artifacts/*.jsonl

  audit-and-deny:
    name: Security and License Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true  # Non-blocking for PRs
    # Audit/license output is informational and duplicated by the dedicated
    # security workflow. Run on main and manual dispatch only; PRs can opt in
    # via the `audit` or `full-ci` label.
    if: >-
      github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'audit') ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6  # stable
        with:
          toolchain: "1.95.0"
      - name: Install cargo-audit
        run: cargo install cargo-audit || true
      - name: Install cargo-deny
        run: cargo install cargo-deny || true
      - name: Run security audit
        run: cargo audit || true
      - name: Check licenses
        run: cargo deny check licenses || true
      - name: Check dependencies
        run: cargo deny check bans || true

  # coverage:
  #   MOVED TO: .github/workflows/coverage.yml
  #   This job was migrated to a dedicated coverage workflow with:
  #     - Strict 70% threshold on main (blocks push)
  #     - Label-gated on PRs (opt-in via 'coverage' label)
  #     - Separate workflow for better control and visibility
  #   See: .github/workflows/coverage.yml
  #   if: ${{ false }}  # Disabled - legacy job
