name: Test Telemetry

# Advisory observability lane. It produces nextest JUnit and a slow-test
# summary without changing the required CI Core merge gate.

on:
  pull_request:
    branches: [ main ]
    types: [labeled]
  push:
    branches: [ main ]
    paths:
      - 'crates/**'
      - 'tests/**'
      - 'tools/bitnet-task/**'
      - 'xtask/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.config/nextest.toml'
      - '.github/workflows/test-telemetry.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: 1
  BITNET_SKIP_SLOW_TESTS: "1"

jobs:
  route-test-telemetry:
    name: Route Test Telemetry
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      selected: ${{ steps.route.outputs.selected }}
      reason: ${{ steps.route.outputs.reason }}
    steps:
      - name: Decide whether test telemetry is selected
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          LABELS_JSON: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail

          selected=false
          reason="ordinary PR without test-telemetry/slow-tests/full-ci label"

          if [ "$EVENT_NAME" != "pull_request" ]; then
            selected=true
            reason="$EVENT_NAME"
          elif python - "$LABELS_JSON" <<'PY'
          import json
          import sys

          labels = set(json.loads(sys.argv[1] or "[]"))
          selected = bool(labels & {"test-telemetry", "slow-tests", "full-ci"})
          sys.exit(0 if selected else 1)
          PY
          then
            selected=true
            reason="explicit test-telemetry/slow-tests/full-ci label"
          fi

          echo "selected=$selected" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          {
            echo "### Test telemetry route"
            echo "- selected: $selected"
            echo "- reason: $reason"
          } >> "$GITHUB_STEP_SUMMARY"

  nextest-junit:
    name: Test Telemetry (JUnit + slow tests)
    needs: route-test-telemetry
    if: needs.route-test-telemetry.outputs.selected == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6  # stable
        with:
          toolchain: "1.95.0"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0  # v2
        with:
          shared-key: test-telemetry-ubuntu
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --version 0.9.131 --locked

      - name: Run nextest (ci profile, JUnit output)
        run: |
          cargo nextest run --locked --profile ci \
            -p bitnet-common \
            -p bitnet-models \
            -p bitnet-tokenizers \
            -p bitnet-quantization \
            -p bitnet-kernels \
            -p bitnet-prompt-templates \
            -p bitnet-receipts \
            -p bitnet-sampling \
            -p bitnet-logits \
            -p bitnet-gguf \
            -p bitnet-generation \
            -p bitnet-device-probe \
            -p bitnet-engine-core \
            --no-default-features --features cpu \
            -- --test-threads 4 || true

      - name: Slow-test summary
        if: always()
        run: |
          set -euo pipefail
          junit=target/nextest/ci/junit.xml
          if [ ! -f "$junit" ]; then
            echo "## Test Telemetry" >> "$GITHUB_STEP_SUMMARY"
            echo "_No JUnit output produced._" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET

          tree = ET.parse("target/nextest/ci/junit.xml")
          root = tree.getroot()
          cases = []
          totals = {"tests": 0, "failures": 0, "skipped": 0, "time": 0.0}

          for suite in root.iter("testsuite"):
              totals["tests"] += int(suite.attrib.get("tests", 0))
              totals["failures"] += int(suite.attrib.get("failures", 0))
              totals["skipped"] += int(suite.attrib.get("skipped", 0))
              totals["time"] += float(suite.attrib.get("time", 0) or 0)
              for case in suite.iter("testcase"):
                  elapsed = float(case.attrib.get("time", 0) or 0)
                  name = f"{case.attrib.get('classname', '?')}::{case.attrib.get('name', '?')}"
                  cases.append((elapsed, name))

          slow = [case for case in sorted(cases, reverse=True) if case[0] >= 0.5][:20]

          print("## Test Telemetry")
          print()
          print(f"- **Tests:** {totals['tests']}")
          print(f"- **Failures:** {totals['failures']}")
          print(f"- **Skipped:** {totals['skipped']}")
          print(f"- **Wall time (sum):** {totals['time']:.1f}s")
          print()

          if slow:
              print("### Slowest tests (>= 0.5s, top 20)")
              print()
              print("| Test | Time (s) |")
              print("|---|---:|")
              for elapsed, name in slow:
                  print(f"| `{name}` | {elapsed:.2f} |")
          else:
              print("_No tests took >= 0.5s._")
          PY

      - name: Upload JUnit artifact
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: nextest-junit
          path: target/nextest/ci/junit.xml
          retention-days: 30
          if-no-files-found: ignore
