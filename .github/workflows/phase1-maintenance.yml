name: Phase 1 Maintenance Artifacts

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - src/**
      - benches/**
      - benchmarks/**
      - docs/api/rust/**
      - '!docs/generated/**'
      - scripts/ci/generate-phase1-artifacts.sh
      - .github/workflows/phase1-maintenance.yml
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - src/**
      - benches/**
      - benchmarks/**
      - docs/api/rust/**
      - '!docs/generated/**'
      - scripts/ci/generate-phase1-artifacts.sh
      - .github/workflows/phase1-maintenance.yml
  schedule:
    - cron: '17 4 * * 1'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phase1-generate:
    name: Generate deterministic phase1 artifacts
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6
        with:
          toolchain: stable

      - name: Generate artifacts
        run: scripts/ci/generate-phase1-artifacts.sh

      - name: Upload generated artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: phase1-maintenance-artifacts
          path: docs/generated/phase1
