name: Fuzz CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'fuzz/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.github/workflows/fuzz-ci.yml'
  workflow_dispatch: {}
  schedule:
    # Run nightly fuzz sessions at 02:00 UTC
    - cron: '0 2 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # Always-on: build a representative fuzz subset on PR/push, and the scheduled matrix on schedule/manual.
  fuzz-build:
    name: Fuzz targets build
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install nightly Rust (required by cargo-fuzz)
        uses: dtolnay/rust-toolchain@888c2e1ea69ab0d4330cbf0af1ecc7b68f368cc1
        with:
          toolchain: nightly

      - name: Cache cargo-fuzz binary
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306  # v5.0.3
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ runner.os }}-${{ hashFiles('fuzz/Cargo.lock') }}

      - name: Rust cache
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0  # v2
        with:
          key: fuzz-build-${{ hashFiles('fuzz/Cargo.lock') }}
          workspaces: fuzz -> target

      - name: Install cargo-fuzz
        # Skip rebuild when the binary cache hit; cargo install will no-op when
        # the same version is already installed. Avoid `--force` so the cached
        # ~/.cargo/bin/cargo-fuzz keyed on fuzz/Cargo.lock is actually used.
        run: command -v cargo-fuzz >/dev/null 2>&1 || cargo install cargo-fuzz --locked

      - name: Build fuzz targets
        run: |
          cd fuzz

          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            targets=(
              quantization_i2s
              quantization_input
              quantization_tl1
              quantization_tl2
              gguf_header
              gguf_header_parse
              gguf_header_roundtrip
              gguf_kv_read
              gguf_metadata_values
              gguf_parser
              gguf_writer_roundtrip
              safetensors_metadata
              safetensors_parser
              kernel_matmul
              tl_lut_helper
              tokenizer_discovery
              tokenizer_encode
              tokenizer_encode_decode
              tokenizer_encode_no_panic
              generation_stop_check
              generation_stop_checker
              logits_transforms
              prompt_template_no_panic
              rope_table_gen
              sampling_no_panic
              transformer_config
              architecture_detection
              engine_core_no_panic
              feature_activation_no_panic
              honest_compute_no_panic
              receipt_json_roundtrip
              runtime_context_parse_no_panic
              validation_no_panic
              vocab_size_extraction
              batch_norm_params
              prefix_cache_ops
              broadcast_shape_fuzz
            )
          else
            # Keep PR/push coverage broad enough to catch compile regressions without timing out.
            targets=(
              quantization_i2s
              gguf_parser
              kernel_matmul
              tokenizer_encode
              generation_stop_check
              validation_no_panic
            )
          fi

          for target in "${targets[@]}"; do
            cargo fuzz build "$target" 2>&1
          done
        env:
          RUSTUP_TOOLCHAIN: nightly
          RUSTFLAGS: -C debuginfo=0

  # Scheduled only: run each selected fuzz target for a short time to catch new crashes
  fuzz-run:
    name: "Fuzz run (${{ matrix.target }})"
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    # Only run on schedule (nightly) or manual workflow dispatch — not on PRs
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        # Selected nightly coverage matrix. fuzz/Cargo.toml has more registered
        # targets; this list is the CI-cost-controlled scheduled subset. The
        # consolidated workflow replaces the former fuzz-nightly.yml and
        # nightly-fuzz.yml runs that fired at the same 02:00 UTC slot.
        target:
          # Quantization
          - quantization_i2s
          - quantization_input
          - quantization_tl1
          - quantization_tl2
          # GGUF parsing
          - gguf_header
          - gguf_header_parse
          - gguf_header_roundtrip
          - gguf_kv_read
          - gguf_metadata_values
          - gguf_parser
          - gguf_writer_roundtrip
          # SafeTensors
          - safetensors_metadata
          - safetensors_parser
          # Kernels & compute
          - kernel_matmul
          - tl_lut_helper
          # Tokenizer
          - tokenizer_discovery
          - tokenizer_encode
          - tokenizer_encode_decode
          - tokenizer_encode_no_panic
          # Inference & generation
          - generation_stop_check
          - generation_stop_checker
          - logits_transforms
          - prompt_template_no_panic
          - rope_table_gen
          - sampling_no_panic
          - transformer_config
          # Validation & runtime
          - architecture_detection
          - engine_core_no_panic
          - feature_activation_no_panic
          - honest_compute_no_panic
          - receipt_json_roundtrip
          - runtime_context_parse_no_panic
          - validation_no_panic
          - vocab_size_extraction
          # Numerics & cache structures
          - batch_norm_params
          - prefix_cache_ops
          - broadcast_shape_fuzz
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@888c2e1ea69ab0d4330cbf0af1ecc7b68f368cc1
        with:
          toolchain: nightly

      - name: Cache cargo-fuzz binary
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306  # v5.0.3
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ runner.os }}-${{ hashFiles('fuzz/Cargo.lock') }}

      - name: Restore fuzz corpus
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306  # v5.0.3
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-

      - name: Rust cache
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0  # v2
        with:
          key: fuzz-run-${{ matrix.target }}

      - name: Install cargo-fuzz
        run: command -v cargo-fuzz >/dev/null 2>&1 || cargo install cargo-fuzz --locked

      - name: Run fuzz target (60 seconds)
        run: |
          cd fuzz
          # -max_total_time limits the run; -timeout guards against single-input hangs
          cargo fuzz run ${{ matrix.target }} -- -max_total_time=60 -timeout=10 2>&1
        continue-on-error: false
        env:
          RUSTUP_TOOLCHAIN: nightly

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f  # v7.0.0
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          retention-days: 30
