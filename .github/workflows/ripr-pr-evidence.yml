name: RIPR PR Evidence

on:
  pull_request:
    paths-ignore:
      - 'docs/tracking/**'
      - '.codex/campaigns/**'
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: ripr-pr-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

jobs:
  ripr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6  # stable
        with:
          toolchain: "1.95.0"

      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0  # v2
        with:
          cache-on-failure: true

      - name: Install ripr
        run: cargo install ripr --locked

      - name: Fetch base branch
        if: github.base_ref != ''
        run: git fetch origin ${{ github.base_ref }}

      - name: Build xtask
        run: cargo build --locked -p xtask --no-default-features

      - name: RIPR PR evidence
        env:
          RIPR_BASE: origin/${{ github.base_ref }}
        run: |
          if ! timeout 50s target/debug/xtask ripr-pr; then
            mkdir -p target/ripr/pr
            printf '%s\n' \
              '{' \
              '  "findings": [],' \
              '  "warnings": ["ripr-pr timed out; JSON and markdown fallback written for advisory contract"]' \
              '}' > target/ripr/pr/repo-exposure.json
            printf '%s\n' \
              'RIPR PR evidence timed out; JSON and markdown fallback written for advisory contract.' \
              > target/ripr/pr/repo-exposure.md
          fi

      - name: RIPR review guidance
        run: |
          if ! timeout 25s target/debug/xtask ripr-review-comments --base origin/${{ github.base_ref }} --head HEAD; then
            mkdir -p target/ripr/review
            printf '%s\n' \
              '{' \
              '  "schema_version": 1,' \
              '  "tool": "ripr",' \
              '  "mode": "review-comments-fallback",' \
              '  "summary": {' \
              '    "status": "timed_out",' \
              '    "warnings": ["ripr review-comments timed out; see EffortlessMetrics/ripr#876"]' \
              '  },' \
              '  "findings": [],' \
              '  "comments": [],' \
              '  "summary_only": true,' \
              '  "suppressed": [],' \
              '  "warnings": ["ripr review-comments timed out; see EffortlessMetrics/ripr#876"]' \
              '}' > target/ripr/review/comments.json
            printf '%s\n' \
              'RIPR review guidance timed out; see EffortlessMetrics/ripr#876.' \
              > target/ripr/review/comments.md
          fi

      - name: RIPR PR contract
        if: always()
        run: target/debug/xtask ripr-pr --check

      - name: RIPR review contract
        if: always()
        run: target/debug/xtask ripr-review-comments --check

      - name: RIPR summary
        if: always()
        run: |
          {
            echo "## RIPR"
            echo
            if [ -f target/ripr/review/comments.md ]; then
              cat target/ripr/review/comments.md
            else
              echo "No RIPR review guidance produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: RIPR annotations
        if: always()
        run: target/debug/xtask ripr-annotations

      - name: Upload RIPR PR evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ripr-pr
          path: target/ripr/pr
          if-no-files-found: warn

      - name: Upload RIPR review guidance
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ripr-review
          path: target/ripr/review
          if-no-files-found: warn
