name: Apple Silicon CI

on:
  push:
    branches: [main]
  pull_request:
    types: [labeled]

concurrency:
  group: apple-silicon-${{ github.event.pull_request.number || github.ref }}
  # Apple Silicon jobs are capped by timeout-minutes below. Do not cancel an
  # in-flight run on a new push: once macOS/arm64 work has started, discarding
  # the result wastes scarce platform minutes and can hide useful failure data.
  cancel-in-progress: false

env:
  BITNET_SKIP_SLOW_TESTS: "1"
  RUSTFLAGS: "-Dwarnings"

jobs:
  build-test-macos:
    name: Build & Test (macOS ARM64)
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'macos') ||
      contains(github.event.pull_request.labels.*.name, 'apple-silicon') ||
      contains(github.event.pull_request.labels.*.name, 'metal') ||
      contains(github.event.pull_request.labels.*.name, 'full-ci')
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6  # stable
        with:
          toolchain: "1.95.0"
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0  # v2
        with:
          shared-key: ci-apple-silicon

      - name: Prefer installed Rust toolchain binaries
        run: echo "$HOME/.rustup/toolchains/1.95.0-aarch64-apple-darwin/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build bitnet-kernels (CPU)
        run: cargo build --locked --no-default-features --features cpu -p bitnet-kernels

      - name: Clippy bitnet-kernels
        run: cargo clippy --locked -p bitnet-kernels --lib --no-default-features --features cpu -- -D warnings

      - name: Test NEON kernels (lib)
        run: cargo test --locked -p bitnet-kernels --no-default-features --features cpu --lib -- neon

      - name: Test NEON integration
        run: cargo test --locked -p bitnet-kernels --no-default-features --features cpu -- neon

  metal-tests:
    name: Metal Tests (macOS ARM64)
    needs: build-test-macos
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6  # stable
        with:
          toolchain: "1.95.0"
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0  # v2
        with:
          shared-key: ci-apple-silicon

      - name: Prefer installed Rust toolchain binaries
        run: echo "$HOME/.rustup/toolchains/1.95.0-aarch64-apple-darwin/bin" >> "$GITHUB_PATH"

      - name: Run Metal tests
        run: cargo test --locked -p bitnet-kernels --no-default-features --features cpu -- metal
