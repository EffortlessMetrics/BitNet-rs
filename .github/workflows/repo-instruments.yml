name: Repo Instruments

on:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**/Cargo.toml'
      - 'scripts/maintenance/**'
      - 'tools/maintenance/**'
      - '.github/workflows/repo-instruments.yml'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/deps.md'
      - 'docs/deps.json'
      - 'docs/public_api/**'
      - 'docs/sbom.json'
      - 'docs/churn.md'
      - 'docs/status.md'
      - 'docs/coverage.md'
  schedule:
    - cron: '20 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-instruments:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@5d458579430fc14a04a08a1e7d3694f545e91ce6
        with:
          toolchain: '1.92.0'

      - name: Install maintenance tools
        run: |
          cargo install cargo-public-api --locked
          cargo install cargo-cyclonedx --locked
          cargo install cargo-llvm-cov --locked

      - name: Generate maintenance artifacts
        run: scripts/maintenance/run_all.sh

      - name: Upload generated artifacts (PR)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repo-instruments
          path: |
            docs/deps.md
            docs/deps.json
            docs/public_api
            docs/sbom.json
            docs/churn.md
            docs/status.md
            docs/coverage.md

      - name: Commit generated docs (main/schedule/manual)
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/deps.md docs/deps.json docs/public_api docs/sbom.json docs/churn.md docs/status.md docs/coverage.md
          git commit -m "chore: refresh repo maintenance instruments [skip ci]"
          git push
