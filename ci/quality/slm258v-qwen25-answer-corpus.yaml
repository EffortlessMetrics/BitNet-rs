schema: 1
artifact_kind: slm_answer_corpus
name: intel-258v-qwen25-strict-slm-answer-smoke-v1
description: Tiny deterministic Qwen2.5 dense SLM answer-readiness corpus for Lunar Lake 258V strict CPU receipts.
model:
  repo: Qwen/Qwen2.5-0.5B-Instruct-GGUF
  file: qwen2.5-0.5b-instruct-q8_0.gguf
  sha256: ca59ca7f13d0e15a8cfa77bd17e65d24f6844b554a7b6c12e07a5f89ff76844e
  family: qwen
  architecture: qwen2
  quant_format: Q8_0
defaults:
  prompt_template: qwen2.5
  max_new_tokens: 16
  greedy: true
  deterministic: true
  strict_loader: true
  temperature: 0.0
  per_prompt_timeout_seconds: 240
  min_generated_tokens: 1
cases:
  - id: math_2_plus_2
    question: "What is 2+2? Answer briefly."
    max_new_tokens: 8
    gate:
      kind: contains_any
      contains_any:
        - "4"
        - "four"

  - id: capital_france
    question: "Name the capital of France."
    max_new_tokens: 8
    gate:
      kind: contains_any
      contains_any:
        - "Paris"
        - "paris"

  - id: rust_sentence
    question: "Write one short sentence about Rust."
    max_new_tokens: 16
    gate:
      kind: contains_any
      contains_any:
        - "Rust"
        - "rust"
        - "programming"
        - "language"
        - "safety"
        - "efficient"
