    source: closed_form_yaml_fixture
    owner_work_item: M4-BITNET-EX-013
    fixed_table_qa: prompt-local table entry is the expected-answer authority;
      reference-runner text may be compared but cannot replace the table-derived
      expected answer.
    numeric_tolerance: expected_number plus numeric_tolerance are the expected-answer
      authority; final-answer extraction avoids scoring prompt-echo numbers as
      answers.
    rewrite_normalized: expected_normalized is the expected-answer authority;
      punctuation, casing, and whitespace normalization are allowed, but semantic
      substitutions are not.
  reference_comparison_plan:
    schema: bitnet_reference_vs_rust_v1
