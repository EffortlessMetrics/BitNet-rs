schema: 1
artifact_kind: slm_answer_corpus
name: lunar-lake-qwen25-answer-corpus-v2
description: Bounded Lunar Lake dense Qwen2.5 answer corpus v2 for profile-aware route regression.
metadata:
  campaign: intel-258v-platform
  work_item: LNL258V-QUAL-001
  route_scope: dense_slm_default_cpu
  model_role: promoted_control_route
  prompt_template: qwen2.5
  corpus_policy: deterministic-static-fixture-v2
  claim_boundary:
    broad_quality_claim: false
    speedup_claim: false
    arc_execution_claim: false
    npu_execution_claim: false
    bitnet_qk256_claim: false
model:
  repo: Qwen/Qwen2.5-0.5B-Instruct-GGUF
  file: qwen2.5-0.5b-instruct-q8_0.gguf
  sha256: ca59ca7f13d0e15a8cfa77bd17e65d24f6844b554a7b6c12e07a5f89ff76844e
  family: qwen
  architecture: qwen2
  quant_format: Q8_0
defaults:
  prompt_template: qwen2.5
  max_new_tokens: 48
  greedy: true
  deterministic: true
  strict_loader: true
  temperature: 0.0
  per_prompt_timeout_seconds: 240
  min_generated_tokens: 1
  min_distinct_generated_tokens: 2
cases:
  - id: math_2_plus_2_brief
    category: math
    profile: regression_tiny
    question: "What is 2+2? Answer briefly."
    max_new_tokens: 8
    scoring:
      kind: required_forbidden_tokens
      required_keywords:
        - "4"
    gate:
      kind: contains_any
      contains_any:
        - "4"
        - "four"

  - id: arithmetic_add_7_8
    category: math
    profile: regression_tiny
    question: "Answer with exactly the number: 7 + 8 ="
    max_new_tokens: 12
    scoring:
      kind: required_forbidden_tokens
      required_keywords:
        - "15"
    gate:
      kind: contains_any
      contains_any:
        - "15"
        - "fifteen"

  - id: copy_exact_color_triplet
    category: copy_exact
    profile: regression_tiny
    question: "Copy exactly these three words and nothing else: red blue green"
    max_new_tokens: 8
    scoring:
      kind: required_keywords
      required_keywords:
        - "red"
        - "blue"
        - "green"
    gate:
      kind: contains_any
      contains_any:
        - "red, blue, green"
        - "Red, blue, green"
        - "red blue green"
        - "Red blue green"

  - id: yes_no_clear_sky
    category: yes_no
    profile: ask_short
    question: "Reply with exactly one word, yes or no: is the sky usually blue on a clear day?"
    max_new_tokens: 1
    scoring:
      kind: normalized_match
      expected_normalized: "yes"
    gate:
      kind: starts_with_any
      starts_with_any:
        - "yes"
        - "Yes"

  - id: short_factual_capital_france
    category: short_factual
    profile: ask_short
    question: "Name the capital of France."
    max_new_tokens: 12
    scoring:
      kind: required_keywords
      required_keywords:
        - "Paris"
    gate:
      kind: contains_any
      contains_any:
        - "Paris"
        - "paris"

  - id: instruction_single_sentence_rust
    category: instruction_following
    profile: ask_normal
    question: "Write one short sentence about Rust."
    max_new_tokens: 24
    scoring:
      kind: required_keywords
      required_keywords:
        - "Rust"
    gate:
      kind: contains_any
      contains_any:
        - "Rust"
        - "rust"
        - "programming"
        - "language"

  - id: stop_token_one_word_done
    category: stop_and_eos
    profile: regression_tiny
    question: "Return exactly this text and nothing else: done"
    max_new_tokens: 4
    scoring:
      kind: normalized_match
      expected_normalized: "done"
    gate:
      kind: starts_with_any
      starts_with_any:
        - "done"
        - "Done"

  - id: transcript_context_code_word
    category: prompt_history_sensitivity
    profile: ask_normal
    question: "Transcript:\nUser: My code word is amber.\nAssistant: Noted.\nUser: What is the code word? Answer with one word."
    max_new_tokens: 12
    scoring:
      kind: required_keywords
      required_keywords:
        - "amber"
    gate:
      kind: contains_any
      contains_any:
        - "amber"
        - "Amber"

  - id: structured_json_city_country
    category: structured_output
    profile: structured
    question: "Return one compact JSON object with keys city and country for Paris, France."
    max_new_tokens: 48
    scoring:
      kind: required_keywords
      required_keywords:
        - "city"
        - "country"
        - "Paris"
        - "France"
      forbidden_tokens:
        - "```"
    gate:
      kind: contains_any
      contains_any:
        - "\"city\""
        - "city"

  - id: long_prompt_summary_route_policy
    category: long_prompt_summarization
    profile: prefill_heavy
    question: "Summarize this policy note in one sentence, and include the exact words Lunar, CPU, and route: Lunar Lake uses dense Qwen CPU as the default route. OpenVINO GPU and NPU remain candidate routes until answer gates, fallback-free execution, and profile timings prove an advantage. BitNet CPU remains the strict reference path."
    max_new_tokens: 40
    scoring:
      kind: required_keywords
      required_keywords:
        - "Lunar"
        - "CPU"
        - "route"
    gate:
      kind: contains_any
      contains_any:
        - "Lunar"
        - "CPU"
        - "route"

  - id: short_reasoning_apples_left
    category: short_reasoning
    profile: ask_normal
    question: "Tom has two apples and gives away one apple. Does Tom have one apple left? Reply yes or no."
    max_new_tokens: 16
    scoring:
      kind: required_keywords
      required_keywords:
        - "yes"
    gate:
      kind: contains_any
      contains_any:
        - "yes"
        - "Yes"

  - id: decode_heavy_short_list
    category: decode_heavy
    profile: decode_heavy
    question: "Use these exact phrases in a short answer: fallback check, model check, tokenizer check, route reason, timing receipt, strict no fallback."
    max_new_tokens: 64
    scoring:
      kind: required_keywords
      required_keywords:
        - "fallback"
        - "model"
      forbidden_tokens:
        - "<|"
    gate:
      kind: readable
      min_words: 8

  - id: low_power_route_evidence_copy
    category: copy_exact
    profile: low_power
    question: "Copy exactly these two words and nothing else: route evidence"
    max_new_tokens: 6
    scoring:
      kind: required_forbidden_tokens
      required_keywords:
        - "route"
        - "evidence"
      forbidden_tokens:
        - "<|"
    gate:
      kind: contains_any
      contains_any:
        - "route evidence"
        - "Route evidence"

  - id: warm_resident_route_copy
    category: resident_session
    profile: warm_resident
    question: "Answer with this exact phrase: warm resident"
    max_new_tokens: 6
    scoring:
      kind: required_keywords
      required_keywords:
        - "resident"
    gate:
      kind: readable
      min_words: 2
