external_pretokenizer_reference_runner_report = "docs/reports/MODEL_ARTIFACT_007_MICROSOFT_BITNETCPP_EXTERNAL_PRETOKENIZER.md"
reference_runner_coherent_output_required = true
sha256_required = true
tokenizer_metadata_required = true
pretokenizer_metadata_required = true

states = [
  "unknown",
  "structurally_valid",
  "rejected_missing_tokenizer_authority",
  "rejected_reference_runner_failed",
  "rejected_prompt_suite_failed",
  "answer_ready",
  "blocked",
]

answer_readiness_scopes = [
  "official_target",
  "alternate_quant_control",
  "diagnostic_only",
]

target_alignments = [
  "official_i2s_cuda_target",
  "official_derived_alt_quant",
  "unrelated",
]

runner_authorities = [
  "stock_llama_cpp",
  "ik_llama_cpp",
  "microsoft_bitnet",
  "unknown",
]

[claim_policy]
structural_validity_is_not_answer_readiness = true
backend_execution_is_not_answer_readiness = true
speedup_requires_answer_ready_artifact = true
answer_ready_artifact_available = true
answer_ready_artifact_id = "microsoft_bitnet_b158_2b_4t_gguf_i2s_current"
current_blocker = "MODEL-ARTIFACT-007 records that the official Microsoft I2_S GGUF passes the committed deterministic answer corpus under Microsoft BitNet.cpp when external Microsoft tokenizer pre-tokenizer authority is supplied with tokenizer.ggml.pre=llama-bpe. Backend lanes remain blocked from local-answer claims until they rerun their own strict CPU/CUDA/accelerator receipt gates against this artifact, tokenizer authority, and prompt template."

allowed_before_answer_ready = [
  "structural GGUF validity",
  "loader and tokenizer diagnostics",
  "backend execution proof",
  "diagnostic_only CPU/CUDA/Metal/NPU receipts",
  "failure classification such as model_artifact_blocked",
]

not_allowed_before_answer_ready = [
  "coherent local-answer claims",
  "CPU answer-readiness claims",
  "CUDA answer-readiness claims",
  "Apple M4 local-answer success claims",
  "NPU, SLM, server, or other hardware answer claims",
  "speedup claims based on generated text quality",
]

