schema = 1
artifact_kind = "bitnet_model_contract_matrix"
updated = "2026-05-09"
work_item = "BITNET-CONTRACT-001"
claim_boundary = "BitNet-family artifacts must declare model family, artifact format, kernel family, architecture support, tokenizer and prompt authority, CPU oracle, accelerator routes, allowed claims, and required receipts before they can be used as proof authority."

claim_rules = [
  "The official Microsoft 2B I2_S GGUF is the current x86 CPU and RTX 5070 Ti CUDA reference lane when paired with external llama-bpe tokenizer authority and bitnetcpp-answer prompt authority.",
  "The Intel Arc A770 OpenCL QK256 route is listed for diagnostic route receipts only until model, quality, residency, and benchmark gates promote a stronger claim.",
  "Official 2B TL1 and TL2 routes are upstream-supported lanes but need their own parser, fixture, prompt authority, answer corpus, and backend receipts before proof claims.",
  "1bitLLM 3B x86 I2_S is upstream-unsupported and remains diagnostic-only.",
  "1bitLLM 3B x86 TL2 and ARM TL1 are listed upstream but require runner-path verification before proof claims.",
  "Alternate-quant control evidence cannot unblock official Microsoft I2_S CUDA readiness.",
  "speedup_claim and full_cuda_residency claims remain false unless profile-specific benchmark and residency receipts explicitly upgrade them.",
]

[[contract]]
id = "microsoft_bitnet_b158_2b_4t_i2s"
model_family = "bitnet_b1_58"
artifact_format = "gguf"
artifact_id = "microsoft_bitnet_b158_2b_4t_gguf_i2s_current"
kernel_family = "i2_s_qk256"
status = "reference_ready"
tokenizer_authority = "external_llama_bpe"
prompt_authority = "bitnetcpp-answer"
cpu_oracle = "x86_cpu_scalar_then_avx512_parity"
permitted_claims = [
  "diagnostic_run",
  "artifact_inspection",
  "answer_ready",
  "reference_authority",
  "backend_parity",
  "benchmark_baseline",
]
forbidden_claims = [
  "speedup_qualified_without_profile_receipt",
  "full_cuda_residency_without_residency_receipt",
]
required_receipts = [
  "answer_artifact_gate",
  "prompt_authority_audit",
  "strict_answer_corpus",
  "cpu_cuda_answer_parity",
  "execution_plan",
  "fallback_free_backend_receipt",
  "benchmark_profile_receipt",
]
claim_boundary = "Reference lane for x86 CPU and RTX 5070 Ti CUDA, but speedup and full-residency claims still require profile-specific receipts."

  [[contract.architecture_support]]
  arch = "x86"
  kernel = "i2_s"
  status = "supported_reference"

  [[contract.architecture_support]]
  arch = "arm"
  kernel = "i2_s"
  status = "supported"

  [[contract.accelerator_route]]
  backend = "cpu-scalar"
  route = "bitnet_i2s_qk256_cpu_scalar"
  status = "oracle"

  [[contract.accelerator_route]]
  backend = "cpu-avx2"
  route = "bitnet_i2s_qk256_cpu_avx2"
  status = "parity_lane"

  [[contract.accelerator_route]]
  backend = "cpu-avx512"
  route = "bitnet_i2s_qk256_cpu_avx512"
  status = "parity_lane"

  [[contract.accelerator_route]]
  backend = "nvidia-rtx-5070-ti-cuda"
  route = "bitnet_qk256_cuda"
  status = "strict_receipt_lane"

  [[contract.accelerator_route]]
  backend = "intel-arc-a770-opencl"
  route = "a770.bitnet.i2s.qk256"
  status = "diagnostic_qk256_route_receipt_only"

