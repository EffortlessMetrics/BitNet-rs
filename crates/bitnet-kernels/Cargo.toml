[package]
name = "bitnet-kernels"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
description = "High-performance compute kernels for BitNet"
include = [
  "src/**",
  "Cargo.toml",
  "build.rs",
  "README.md",
  "csrc/**",
]

[dependencies]
bitnet-common = { path = "../bitnet-common", version = "0.2.1-dev" }
bitnet-cpu-activations = { path = "../bitnet-cpu-activations", version = "0.2.1-dev" }
bitnet-cpu-detect = { path = "../bitnet-cpu-detect", version = "0.2.1-dev", default-features = false }
bitnet-device-probe = { path = "../bitnet-device-probe", version = "0.2.1-dev" }
bitnet-kv-cache-policy-core = { path = "../bitnet-kv-cache-policy-core", version = "0.2.1-dev" }
bitnet-simd = { path = "../bitnet-simd", version = "0.2.1-dev" }
thiserror.workspace = true
bytemuck.workspace = true
rayon.workspace = true
log.workspace = true
opencl3 = { version = "0.12", optional = true }
cc = { version = "1.2.46", optional = true }
bindgen = { version = "0.72.1", optional = true }
half = { version = "2.7.1", optional = true }
sysinfo = "0.38.0"
memory-stats = "1.2.0"

[target.'cfg(target_os = "windows")'.dependencies]
cudarc = { version = "0.19.6", optional = true, default-features = false, features = ["std", "driver", "nvrtc", "dynamic-linking", "cuda-12000"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
cudarc = { version = "0.19.6", optional = true, default-features = false, features = ["std", "driver", "nvrtc", "fallback-dynamic-loading", "cuda-12000"] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
wgpu = { version = "24", optional = true, features = ["metal"] }
pollster = { version = "0.4", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.182"

[build-dependencies]
bindgen = { version = "0.72.1", optional = true }
cc = { version = "1.2.46", optional = true }

[dev-dependencies]
criterion.workspace = true
env_logger = "0.11.10"
serde_json.workspace = true
tempfile = "3.23.0"
temp-env = "0.3.6"
serial_test.workspace = true
anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive"] }
half = "2.7.1"
bitnet-quantization = { path = "../bitnet-quantization", version = "0.2.1-dev" }
proptest.workspace = true
bitnet-ggml-ffi = { path = "../bitnet-ggml-ffi", version = "0.2.1-dev" }
rand = "0.9.2"
insta.workspace = true
rand_chacha = "0.9.0"
bitnet-tests = { path = "../../tests", version = "0.2.1-dev" }
bitnet-test-support.workspace = true
libc = "0.2.182"
libm = "0.2.16"

[target.'cfg(target_arch = "x86_64")'.dependencies]
# x86-specific dependencies

[target.'cfg(target_arch = "aarch64")'.dependencies]
# ARM-specific dependencies

[features]
integration-tests = []
default = []
npu-backend = []
cpu = ["cpu-fallback", "dep:half"]
cpu-fallback = []
cpu-optimized = ["avx512", "avx2", "neon"]
avx2 = ["bitnet-cpu-detect/avx2"]
avx512 = ["bitnet-cpu-detect/avx512"]
neon = ["bitnet-cpu-detect/neon"]
cuda = ["dep:cudarc", "dep:half", "bitnet-device-probe/cuda"]
rocm = ["bitnet-device-probe/rocm"]
hip = ["rocm"]
gpu = ["cuda", "vulkan", "bitnet-device-probe/gpu"]  # GPU umbrella
vulkan = ["bitnet-device-probe/vulkan"]
oneapi = ["dep:opencl3", "bitnet-common/oneapi", "bitnet-device-probe/oneapi"]
opencl = ["dep:opencl3", "bitnet-common/opencl", "bitnet-device-probe/opencl"]
ffi = ["dep:cc", "dep:bindgen"]
metal = []
metal-runtime = ["metal", "dep:wgpu", "dep:pollster"]
inference = []
strict = []  # Strict mode for mock elimination validation

[[bench]]
name = "kernel_benchmarks"
harness = false

[[bench]]
name = "rtx5070ti_cuda_benchmark"
harness = false
required-features = ["cuda"]

[[test]]
name = "kernel_tests"
path = "tests/kernel_tests.rs"

[[test]]
name = "apple_silicon_benchmarks"
path = "tests/apple_silicon_benchmarks.rs"

[[test]]
name = "neon_correctness_exhaustive"
path = "tests/neon_correctness_exhaustive.rs"

[[test]]
name = "metal_adapter_detection_tests"
path = "tests/metal_adapter_detection_tests.rs"
required-features = ["metal-runtime"]

[[test]]
name = "metal_compute_validation_tests"
path = "tests/metal_compute_validation_tests.rs"
required-features = ["metal-runtime"]

[[test]]
name = "metal_device_integration_tests"
