[package]
name = "bitnet-kernels"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
description = "High-performance compute kernels for BitNet"
include = [
  "src/**",
  "Cargo.toml",
  "build.rs",
  "README.md",
  "csrc/**",
]

[dependencies]
bitnet-common = { path = "../bitnet-common", version = "0.2.1-dev" }
bitnet-cpu-activations = { path = "../bitnet-cpu-activations", version = "0.2.1-dev" }
bitnet-cpu-detect = { path = "../bitnet-cpu-detect", version = "0.2.1-dev", default-features = false }
bitnet-device-probe = { path = "../bitnet-device-probe", version = "0.2.1-dev" }
bitnet-simd = { path = "../bitnet-simd", version = "0.2.1-dev" }
thiserror.workspace = true
bytemuck.workspace = true
rayon.workspace = true
log.workspace = true
cudarc = { version = "0.17.8", optional = true, features = ["cuda-12000"] }
opencl3 = { version = "0.9", optional = true }
cc = { version = "1.2.46", optional = true }
bindgen = { version = "0.72.1", optional = true }
half = { version = "2.7.1", optional = true }
sysinfo = "0.37.2"
memory-stats = "1.2.0"

[build-dependencies]
bindgen = { version = "0.72.1", optional = true }
cc = { version = "1.2.46", optional = true }

[dev-dependencies]
criterion.workspace = true
env_logger = "0.11.8"
serde_json.workspace = true
tempfile = "3.23.0"
temp-env = "0.3.6"
serial_test.workspace = true
anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive"] }
half = "2.7.1"
bitnet-quantization = { path = "../bitnet-quantization", version = "0.2.1-dev" }
proptest.workspace = true
bitnet-ggml-ffi = { path = "../bitnet-ggml-ffi", version = "0.2.1-dev" }
rand = "0.9.2"
insta.workspace = true
rand_chacha = "0.9.0"
bitnet-tests = { path = "../../tests", version = "0.2.1-dev" }
bitnet-test-support.workspace = true
libm = "0.2.16"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dev-dependencies]
wgpu = { version = "24", features = ["metal"] }
pollster = "0.4"

[target.'cfg(target_arch = "x86_64")'.dependencies]
# x86-specific dependencies

[target.'cfg(target_arch = "aarch64")'.dependencies]
# ARM-specific dependencies

[features]
integration-tests = []
default = []
npu-backend = []
cpu = ["cpu-fallback"]
cpu-fallback = []
cpu-optimized = ["avx512", "avx2", "neon"]
avx2 = ["bitnet-cpu-detect/avx2"]
avx512 = ["bitnet-cpu-detect/avx512"]
neon = ["bitnet-cpu-detect/neon"]
cuda = ["dep:cudarc", "dep:half", "bitnet-device-probe/cuda"]
rocm = ["bitnet-device-probe/rocm"]
hip = ["rocm"]
gpu = ["cuda", "vulkan", "bitnet-device-probe/gpu"]  # GPU umbrella
vulkan = ["bitnet-device-probe/vulkan"]
oneapi = ["dep:opencl3", "bitnet-common/oneapi", "bitnet-device-probe/oneapi"]
opencl = ["dep:opencl3", "bitnet-common/opencl", "bitnet-device-probe/opencl"]
ffi = ["dep:cc", "dep:bindgen"]
metal = []
inference = []
strict = []  # Strict mode for mock elimination validation

[[bench]]
name = "kernel_benchmarks"
harness = false

[[test]]
name = "kernel_tests"
path = "tests/kernel_tests.rs"

[[test]]
name = "apple_silicon_benchmarks"
path = "tests/apple_silicon_benchmarks.rs"

[[test]]
name = "neon_correctness_exhaustive"
path = "tests/neon_correctness_exhaustive.rs"

[[test]]
name = "metal_device_integration_tests"
path = "tests/metal_device_integration_tests.rs"

[[test]]
name = "opencl_fuzz_targets"
path = "tests/opencl_fuzz_targets.rs"

[[test]]
name = "cpu_scalar_parity"
path = "tests/cpu_scalar_parity.rs"
required-features = ["cpu"]

[[test]]
name = "proptest_wave23"
path = "tests/proptest_wave23.rs"
required-features = ["cpu"]

[[test]]
name = "proptest_wave24"
path = "tests/proptest_wave24.rs"
required-features = ["cpu"]

[[test]]
name = "kernel_perf_smoke"
path = "tests/kernel_perf_smoke.rs"
required-features = ["cpu"]

[[test]]
name = "metal_compute_pipeline_tests"
path = "tests/metal_compute_pipeline_tests.rs"

[[example]]
name = "gpu_validation"
path = "examples/gpu_validation.rs"
required-features = ["gpu"]

