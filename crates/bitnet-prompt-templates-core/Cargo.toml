[package]
name = "bitnet-prompt-templates-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "Core prompt template types and formatting logic for BitNet inference"
categories.workspace = true
keywords.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
bitnet-tokenizers = { path = "../bitnet-tokenizers", version = "0.2.1-dev" }

[dev-dependencies]
proptest = { workspace = true }
insta = { workspace = true }
tracing-test.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
criterion = { version = "0.5", features = ["html_reports"] }
bitnet-common = { path = "../bitnet-common", version = "0.2.1-dev" }

[[bench]]
name = "template_ops"
harness = false
