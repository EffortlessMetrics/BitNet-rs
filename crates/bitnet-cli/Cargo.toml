[package]
name = "bitnet-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Command-line interface for BitNet inference"
include = [
  "src/**",
  "Cargo.toml",
]

[lib]
name = "bitnet_cli"
path = "src/lib.rs"

[[bin]]
name = "bitnet"
path = "src/main.rs"

[dependencies]
bitnet-common = { path = "../bitnet-common", version = "0.2.1-dev" }
bitnet-models = { path = "../bitnet-models", version = "0.2.1-dev" }
bitnet-inference = { path = "../bitnet-inference", version = "0.2.1-dev" }
bitnet-kernels = { path = "../bitnet-kernels", version = "0.2.1-dev" }
bitnet-qk256-dispatch = { path = "../bitnet-qk256-dispatch", version = "0.2.1-dev" }
bitnet-quantization = { path = "../bitnet-quantization", version = "0.2.1-dev" }
bitnet-tokenizers = { path = "../bitnet-tokenizers", version = "0.2.1-dev" }
bitnet-transformer = { path = "../bitnet-transformer", version = "0.2.1-dev" }
bitnet-tokenizer-discovery-core = { path = "../bitnet-tokenizer-discovery-core", version = "0.2.1-dev" }
bitnet-prompt-templates = { path = "../bitnet-prompt-templates", version = "0.2.1-dev" }
bitnet-repl-core = { path = "../bitnet-repl-core", version = "0.2.1-dev" }
bitnet-runtime-bootstrap = { path = "../bitnet-runtime-bootstrap", version = "0.2.1-dev" }
bitnet-startup-contract-guard = { path = "../bitnet-startup-contract-guard", version = "0.2.1-dev" }
bitnet-validation = { path = "../bitnet-validation", version = "0.2.1-dev" }
bitnet-sampling = { path = "../bitnet-sampling", version = "0.2.1-dev" }
bitnet-eval-core = { path = "../bitnet-eval-core", version = "0.2.1-dev" }
bitnet-cli-sampling-core = { path = "../bitnet-cli-sampling-core", version = "0.2.1-dev" }
bitnet-cli-config-core = { path = "../bitnet-cli-config-core", version = "0.2.1-dev" }
bitnet-device-probe = { path = "../bitnet-device-probe", version = "0.2.1-dev", default-features = false }
bitnet-receipts-core = { path = "../bitnet-receipts-core", version = "0.2.1-dev" }
bitnet-scoring-core = { path = "../bitnet-scoring-core", version = "0.2.1-dev" }
bitnet-download = { path = "../bitnet-download", version = "0.2.1-dev" }
bitnet-ggml-ffi = { path = "../bitnet-ggml-ffi", version = "0.2.1-dev", optional = true }
candle-core.workspace = true
anyhow.workspace = true
clap = { workspace = true, features = ["derive", "env", "color"] }
tokio = { workspace = true, features = ["full"] }
futures.workspace = true
reqwest = { workspace = true, features = ["stream"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
indicatif = { workspace = true, features = ["tokio"] }
serde_json.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_yaml = { workspace = true }
toml.workspace = true
dirs.workspace = true
console.workspace = true
humantime.workspace = true
humansize.workspace = true
crossterm.workspace = true
clap_complete.workspace = true
num_cpus.workspace = true
chrono = { workspace = true, features = ["serde"] }
memmap2.workspace = true
libc = "0.2.177"
sha2 = "0.10.9"
bytemuck = "1.24.0"
half = "2.7.1"
sysinfo.workspace = true

[dev-dependencies]
assert_cmd = "2.1.1"
predicates = "3.1.3"
proptest.workspace = true
tempfile = "3.23.0"
serial_test = "3.2.0"
temp-env = "0.3.6"
insta = { workspace = true, features = ["json"] }

[features]
default = ["cpu", "full-cli"]
runtime-profile-core = [
  "bitnet-runtime-bootstrap/runtime-profile-inference",
  "bitnet-runtime-bootstrap/runtime-profile-kernels",
  "bitnet-runtime-bootstrap/runtime-profile-tokenizers",
  "bitnet-runtime-bootstrap/runtime-profile-quantization",
]
cpu = [
  "bitnet-inference/cpu",
  "bitnet-kernels/cpu",
  "bitnet-qk256-dispatch/cpu",
  "bitnet-device-probe/cpu",
  "bitnet-transformer/cpu",
  "runtime-profile-core",
  "bitnet-runtime-bootstrap/runtime-profile-cpu",
]
cuda = [
  "bitnet-common/cuda",
  "bitnet-models/cuda",
  "bitnet-inference/cuda",
  "bitnet-kernels/cuda",
  "bitnet-qk256-dispatch/cuda",
  "bitnet-device-probe/cuda",
  "runtime-profile-core",
  "bitnet-runtime-bootstrap/runtime-profile-cuda",
]
metal = [
  "bitnet-common/metal",
  "bitnet-inference/metal",
  "bitnet-kernels/metal-runtime",
  "bitnet-qk256-dispatch/metal",
  "runtime-profile-core",
]
gpu = ["cuda", "metal", "bitnet-runtime-bootstrap/runtime-profile-gpu"]
opencl = [
  "bitnet-common/opencl",
  "bitnet-device-probe/opencl",
  "bitnet-inference/opencl",
  "bitnet-kernels/opencl",
  "bitnet-models/opencl",
  "bitnet-qk256-dispatch/opencl",
  "bitnet-quantization/opencl",
  "runtime-profile-core",
]
# IQ2_S support via GGML FFI
iq2s-ffi = [
    "bitnet-models/iq2s-ffi",
    "bitnet-ggml-ffi/iq2s-ffi",
    "bitnet-runtime-bootstrap/runtime-profile-iq2s-ffi",
]
# Cross-validation support
crossval = ["bitnet-runtime-bootstrap/runtime-profile-crossval"]
# Gate benchmark subcommand behind feature flag
cli-bench = []
# build the extra subcommands only when you want them
full-cli = ["cli-bench", "runtime-profile-core", "bitnet-runtime-bootstrap/runtime-profile-cli"]
trace = ["bitnet-inference/trace", "bitnet-runtime-bootstrap/runtime-profile-trace"]  # Enable tensor activation tracing
# Mock feature - compile-time firewall (intentionally triggers compile_error! in main.rs)
# This prevents production CLI builds with test mocks
# DO NOT enable this feature - it will fail to compile by design
mock = []

[lints]
workspace = true
