[package]
name = "bitnet-qk256-dispatch"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "SRP microcrate for I2_S QK256 forward dispatch over Candle tensors"
categories.workspace = true
keywords.workspace = true
readme = "README.md"
repository.workspace = true
rust-version.workspace = true

[dependencies]
bitnet-common = { path = "../bitnet-common", version = "0.2.1-dev" }
bitnet-kernels = { path = "../bitnet-kernels", version = "0.2.1-dev", optional = true, default-features = false }
bitnet-qk256-layout-core = { path = "../bitnet-qk256-layout-core", version = "0.2.1-dev" }
bitnet-quantization = { path = "../bitnet-quantization", version = "0.2.1-dev" }
candle-core = { workspace = true }
tracing.workspace = true

[dev-dependencies]
bitnet-test-support.workspace = true

[features]
default = []
cpu = ["bitnet-quantization/cpu"]
cuda = [
  "dep:bitnet-kernels",
  "bitnet-kernels/cuda",
]
metal = ["bitnet-common/metal"]
opencl = ["bitnet-common/opencl", "bitnet-quantization/opencl"]
oneapi = ["bitnet-common/oneapi", "bitnet-quantization/oneapi", "opencl"]
gpu = ["cuda", "metal", "opencl"]

[lints]
workspace = true
