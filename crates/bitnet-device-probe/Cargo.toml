[package]
name = "bitnet-device-probe"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Device detection and capability probing for BitNet inference"
rust-version.workspace = true

[dependencies]
bitnet-common = { path = "../bitnet-common", version = "0.2.1-dev" }
bitnet-intel-gpu-id = { path = "../bitnet-intel-gpu-id", version = "0.2.1-dev" }
log.workspace = true
serde = { workspace = true, features = ["derive"] }
ash = { version = "0.38.0", optional = true }
opencl3 = { version = "0.12", optional = true }
libloading = { version = "0.8.9", optional = true }
wgpu = { version = "24", features = ["vulkan-portability"], optional = true }
pollster = { version = "0.4", optional = true }
cudarc = { version = "0.17.8", optional = true, default-features = false, features = ["std", "driver", "dynamic-loading", "cuda-12000"] }

[dev-dependencies]
temp-env.workspace = true
serial_test.workspace = true
insta = { workspace = true }
proptest.workspace = true
serde_json.workspace = true

[features]
default = []
cpu = ["level-zero-loader"]
gpu = ["cuda"]
cuda = ["dep:cudarc", "dep:libloading"]
metal = []
rocm = []
vulkan = ["dep:ash"]
npu = ["oneapi"]
oneapi = ["dep:opencl3"]
opencl = ["dep:opencl3", "dep:libloading"]
level-zero-loader = ["dep:libloading"]
wgpu-probe = ["dep:wgpu", "dep:pollster"]

[[test]]
name = "oneapi_detection_bdd"
path = "tests/oneapi_detection_bdd.rs"

[lints]
workspace = true
